[package]
name = "wfc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["crates/ghostty-vt", "crates/legacy-state"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ghostty-vt = { path = "crates/ghostty-vt" }
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
serde = { version = "1", features = ["derive"] }
wfc-legacy-state = { path = "crates/legacy-state" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
