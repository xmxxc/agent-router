name: Linux OpenCode combination and package
on:
  push:
    branches: [rust-router/38-opencode-jammy-ci]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PRODUCT_SHA: 453fe04cd18dfccd525c8070ebfe33e659146a1a
      PRODUCT_TREE: a30c73e0c4fdb8bab531079edcbf622e9f59d560
      PRODUCT_PARENTS: '3578eebb0aa13e7470ef72a088d5fa074546e268 3abcd84e8e6e98e56ed4b655daf950c1ac6d82e1'
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: '2'
      LC_ALL: C.UTF-8
      EVIDENCE: ${{ github.workspace }}/linux-opencode-relay-evidence
    steps:
      - name: Record workflow run
        run: |
          mkdir -p "$EVIDENCE"
          printf 'workflow=%s\nrun=%s\nattempt=%s\nexpectedProduct=%s\nexpectedTree=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PRODUCT_SHA" "$PRODUCT_TREE" |
            tee "$EVIDENCE/run.log"
      - name: Check out the CI scripts
        id: ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - name: Check out the frozen combination
        id: product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the verified native CI zlib input
        id: native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify fixed source and native inputs
        id: sources
        working-directory: product
        run: |
          {
            test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_SHA"
            git -C ../ci show -s --format='workflow=%H tree=%T parents=%P'
            test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
            test "$(git show -s --format=%P)" = "$PRODUCT_PARENTS"
            test -z "$(git status --porcelain)"
            git show -s --format='product=%H tree=%T parents=%P'
            test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
            git -C ../native-input show -s --format='native-input=%H tree=%T'
            printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c \
              ../native-input/vendor/zlib-1.3.1.tar.gz | sha256sum --check --strict
            sha256sum vendor/INPUTS.sha256
            sha256sum --check --strict vendor/INPUTS.sha256
          } 2>&1 | tee "$EVIDENCE/sources.log"
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned Linux x86-64 Zig
        id: zig
        run: |
          {
            package=zig-x86_64-linux-0.16.0
            archive="$RUNNER_TEMP/$package.tar.xz"
            digest=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            verified=0
            for base in https://ziglang.org/download/0.16.0 https://zig.bcr.ist; do
              url="$base/$package.tar.xz"
              printf 'Downloading %s\n' "$url"
              if curl --fail --silent --show-error --location --retry 2 --retry-max-time 180 \
                --connect-timeout 15 --max-time 120 --output "$archive" "$url" &&
                printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict; then
                verified=1
                break
              fi
            done
            test "$verified" = 1
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            zig_dir="$RUNNER_TEMP/$package"
            version=$("$zig_dir/zig" version)
            printf 'Zig %s\n' "$version"
            test "$version" = 0.16.0
            printf '%s\n' "$zig_dir" >> "$GITHUB_PATH"
          } 2>&1 | tee "$EVIDENCE/zig-install.log"
      - name: Prepare the Linux toolchain
        id: toolchain
        run: |
          {
            rustup toolchain install 1.96.1 --profile minimal --component rustfmt
            if ! command -v pkg-config >/dev/null || ! pkg-config --exists openssl zlib ||
               ! command -v tmux >/dev/null || ! command -v readelf >/dev/null ||
               ! command -v openssl >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends pkg-config libssl-dev zlib1g-dev tmux binutils openssl
            fi
            cat /etc/os-release
            uname -srm
            id -u
            rustc +1.96.1 -vV
            cargo +1.96.1 --version
            zig version
            python3 --version
            tmux -V
            cc --version
            curl --version
            pkg-config --modversion openssl zlib
            dpkg-query -W libssl3 zlib1g
          } 2>&1 | tee "$EVIDENCE/toolchain.log"
      - name: Materialize Ghostty and verify the fixed zlib package
        id: ghostty
        working-directory: product
        run: |
          python3 tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz 2>&1 |
            tee "$EVIDENCE/ghostty.log"
      - name: Prime the fixed Wuffs package
        id: wuffs
        working-directory: product/vendor/libghostty-vt
        run: |
          url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          {
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c \
              "$archive" | sha256sum --check --strict
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the frozen release
        id: build
        working-directory: product
        env:
          WFC_BUILD_ID: ${{ env.PRODUCT_SHA }}
        run: |
          {
            cargo fmt --all -- --check
            cargo build --release --locked --target "$TARGET" --bin wfc
            binary="target/$TARGET/release/wfc"
            version=$("$binary" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(Rust, $TARGET, release, build $PRODUCT_SHA)" ]]
            sha256sum "$binary" | tee "$EVIDENCE/binary.sha256"
          } 2>&1 | tee "$EVIDENCE/build.log"
      - name: Record ELF, GLIBC, libcurl and OpenSSL
        id: libraries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          bash ../ci/tools/ci/opencode-relay/libraries.sh 2>&1 | tee "$EVIDENCE/libraries-step.log"
      - name: Package and verify the unpacked ELF and libcurl notices
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          bash ../ci/tools/ci/opencode-relay/package.sh 2>&1 | tee "$EVIDENCE/package.log"
      - name: Run the OpenCode, Codex and scope owner regressions
        id: suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          bash ../ci/tools/ci/opencode-relay/verify.sh 2>&1 | tee "$EVIDENCE/suites-step.log"
      - name: Record step outcomes and checksum the evidence
        if: ${{ always() }}
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          SOURCES_OUTCOME: ${{ steps.sources.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          ZIG_OUTCOME: ${{ steps.zig.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          GHOSTTY_OUTCOME: ${{ steps.ghostty.outcome }}
          WUFFS_OUTCOME: ${{ steps.wuffs.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LIBRARIES_OUTCOME: ${{ steps.libraries.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SUITES_OUTCOME: ${{ steps.suites.outcome }}
        run: |
          mkdir -p "$EVIDENCE"
          cd "$EVIDENCE"
          first_failure=none
          {
            for step in CI PRODUCT NATIVE SOURCES PYTHON ZIG TOOLCHAIN GHOSTTY WUFFS BUILD LIBRARIES PACKAGE SUITES; do
              name="${step}_OUTCOME"
              result=${!name}
              printf '%s=%s\n' "$step" "$result"
              if [[ "$first_failure" == none && "$result" == failure ]]; then
                first_failure=$step
              fi
            done
            printf 'firstFailedStep=%s\n' "$first_failure"
          } | tee outcomes.log
          shopt -s nullglob
          sha256sum -- *.log *.sha256 *.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload Linux relay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-opencode-jammy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
