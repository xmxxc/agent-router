name: Jammy Herdr shared confirmation on the current integration base
on:
  push:
    branches: [rust-router/35-herdr-shared-confirmation-current-r34-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-handoff:
    name: '#35 native cross handoff and Herdr offline resume'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PRODUCT_SHA: e9d0d2fdffb56fa0d6e9cf1aca515a0e223c5f58
      PRODUCT_TREE: a216fd0014e41247778eb58af03550307745279b
      PRODUCT_PARENTS: 496f31086ce0ed84bbb112a42ca627d35bfd5fac 54c52e3011b618c48a4d88669de83d2b8aa765b5
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      NATIVE_INPUT_TREE: 7480986f4468ffafc76b95012562945ee586b52a
      HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      LEGACY_PREVIEW_SOURCE: 861ae6d2d5a6c43a6755f6a33b97240c344f9f24:tools/ci/legacy-cutover-preview/probe.py
      LEGACY_PREVIEW_SHA256: 4124eba4736f420501c5851df094e8bd57b607f2ad371869514761c3b69a3088
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: '2'
      EVIDENCE: ${{ github.workspace }}/linux-herdr-shared-confirmation-r34-evidence
    steps:
      - name: Record workflow and run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW_SHA" "head=$GITHUB_SHA" \
            "ref=$GITHUB_REF" "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" \
            "expectedProduct=$PRODUCT_SHA" "expectedTree=$PRODUCT_TREE" \
            "expectedParents=$PRODUCT_PARENTS" | tee "$EVIDENCE/run.log"
      - name: Check out the fixed workflow and test runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          persist-credentials: false
      - name: Check out the fixed PR product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Check out the approved zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the approved sources and both input manifests
        working-directory: product
        run: |
          {
            test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
            test "$GITHUB_REF" = refs/heads/rust-router/35-herdr-shared-confirmation-current-r34-jammy-ci
            test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
            ci_parents=$(git -C ../ci cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd' ' -)
            test "$ci_parents" = "$PRODUCT_SHA"
            git -C ../ci show -s --format='ci=%H tree=%T parents=%P'
            test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
            parents=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd' ' -)
            test "$parents" = "$PRODUCT_PARENTS"
            git show -s --format='product=%H tree=%T parents=%P'
            test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
            test "$(git -C ../native-input rev-parse 'HEAD^{tree}')" = "$NATIVE_INPUT_TREE"
            git -C ../native-input show -s --format='nativeInput=%H tree=%T'
            for checkout in . ../ci ../native-input; do
              test -z "$(git -C "$checkout" status --porcelain)"
            done
            approved=../ci/tools/ci/resume/APPROVED.sha256
            sha256sum "$approved" vendor/INPUTS.sha256 ../ci/tools/ci/resume/{verify.sh,run.py,reap.py,check_offline_resume.py,resume_worker.py} \
              ../ci/.github/workflows/linux-handoff.yml
            sha256sum --check --strict "$approved"
            printf '%s  %s\n' "$LEGACY_PREVIEW_SHA256" ../ci/tools/ci/legacy-cutover-preview/probe.py |
              sha256sum --check --strict
            printf '%s\n' "legacyPreviewSource=$LEGACY_PREVIEW_SOURCE"
            sha256sum --check --strict vendor/INPUTS.sha256
            wc -l "$approved" vendor/INPUTS.sha256
          } 2>&1 | tee "$EVIDENCE/sources.log"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the approved Zig archive
        run: |
          {
            package=zig-x86_64-linux-0.16.0
            archive="$RUNNER_TEMP/$package.tar.xz"
            digest=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            verified=0
            for base in https://ziglang.org/download/0.16.0 https://zig.bcr.ist; do
              url="$base/$package.tar.xz"
              printf 'Downloading %s\n' "$url"
              if curl --fail --silent --show-error --location --retry 2 --retry-max-time 180 \
                --connect-timeout 15 --max-time 120 --output "$archive" "$url" &&
                printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict; then
                verified=1
                break
              fi
            done
            test "$verified" = 1
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            zig_dir="$RUNNER_TEMP/$package"
            version=$("$zig_dir/zig" version)
            printf 'Zig %s\n' "$version"
            test "$version" = 0.16.0
            printf '%s\n' "$zig_dir" >> "$GITHUB_PATH"
          } 2>&1 | tee "$EVIDENCE/zig-install.log"
      - name: Prepare native tmux and the fixed build toolchain
        run: |
          {
            rustup toolchain install 1.96.1 --profile minimal
            command -v tmux
            test "$(id -u)" -ne 0
            grep -Fx 'VERSION_ID="22.04"' /etc/os-release
            getconf GNU_LIBC_VERSION
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
            id -u
            uname -srm
            rustc +1.96.1 -vV
            cargo +1.96.1 --version
            zig version
            python3 --version
            tmux -V
            cc --version
          } 2>&1 | tee "$EVIDENCE/toolchain.log"
      - name: Materialize verified Ghostty and zlib sources
        working-directory: product
        run: |
          python3 tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz \
            2>&1 | tee "$EVIDENCE/native-prepare.log"
      - name: Prime the pinned Wuffs package
        working-directory: product/vendor/libghostty-vt
        run: |
          {
            url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
            archive="$RUNNER_TEMP/wuffs.tar.gz"
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" |
              sha256sum --check --strict
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the fixed release ELF
        id: build
        working-directory: product
        env:
          WFC_BUILD_ID: ${{ env.PRODUCT_SHA }}
        run: |
          {
            cargo +1.96.1 build --release --locked --target "$TARGET" --bin wfc
            binary="target/$TARGET/release/wfc"
            version=$("$binary" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(Rust, $TARGET, release, build $PRODUCT_SHA)" ]]
            sha256sum "$binary" | tee "$EVIDENCE/elf.sha256"
            readelf -hW "$binary"
          } 2>&1 | tee "$EVIDENCE/build.log"
      - name: Verify the fixed Herdr 0.9.5 release ELF
        id: herdr
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          {
            herdr="$RUNNER_TEMP/herdr-linux-x86_64"
            url=https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
            printf '%s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-connrefused \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$herdr"
            printf '%s  %s\n' "$HERDR_SHA256" "$herdr" | sha256sum --check --strict
            chmod 700 "$herdr"
            test "$("$herdr" --version)" = 'herdr 0.9.5'
            "$herdr" --version
            sha256sum "$herdr" | tee "$EVIDENCE/herdr-elf.sha256"
          } 2>&1 | tee "$EVIDENCE/herdr-release.log"
      - name: Recheck both Herdr close status regressions
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          export HERDR_BINARY="$RUNNER_TEMP/herdr-linux-x86_64"
          bash ../ci/tools/ci/resume/verify.sh herdr-close-status 2>&1 | tee "$EVIDENCE/herdr-close-status.log"
      - name: Verify existing same-service tmux handoff
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: bash ../ci/tools/ci/resume/verify.sh tmux-handoff 2>&1 | tee "$EVIDENCE/tmux-handoff.log"
      - name: Verify tmux to Herdr handoff with a private service
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          export HERDR_BINARY="$RUNNER_TEMP/herdr-linux-x86_64"
          bash ../ci/tools/ci/resume/verify.sh cross-handoff 2>&1 | tee "$EVIDENCE/cross-handoff.log"
      - name: Verify Herdr to tmux handoff with private native services
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          export HERDR_BINARY="$RUNNER_TEMP/herdr-linux-x86_64"
          bash ../ci/tools/ci/resume/verify.sh reverse-handoff 2>&1 | tee "$EVIDENCE/reverse-handoff.log"
      - name: Verify standalone Herdr create and close
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          export HERDR_BINARY="$RUNNER_TEMP/herdr-linux-x86_64"
          bash ../ci/tools/ci/resume/verify.sh herdr-close 2>&1 | tee "$EVIDENCE/herdr-close.log"
      - name: Verify the shared tmux input preflight and original receipts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: bash ../ci/tools/ci/resume/verify.sh input-compat 2>&1 | tee "$EVIDENCE/input-compat.log"
      - name: Verify native offline Herdr resume on the same release ELF
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          export HERDR_BINARY="$RUNNER_TEMP/herdr-linux-x86_64"
          bash ../ci/tools/ci/resume/verify.sh offline-herdr 2>&1 | tee "$EVIDENCE/offline-herdr.log"
      - name: Verify shared tmux continuations and replacement receipts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: bash ../ci/tools/ci/resume/verify.sh resume-compat 2>&1 | tee "$EVIDENCE/resume-compat.log"
      - name: Verify legacy write fencing before and after the selected locks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          bash ../ci/tools/ci/resume/verify.sh legacy-write-lock 2>&1 | tee "$EVIDENCE/legacy-write-lock.log"
          for marker in 'close:' 'reclaim:' 'herdr None:' 'tmux None:' 'tmux ~/alt:'; do
            test "$(grep -Fc "$marker" "$EVIDENCE/legacy-write-lock.log")" = 1
          done
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$EVIDENCE/legacy-write-lock.log"
      - name: Verify shared reply receipts and the imported Inbox high water
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: bash ../ci/tools/ci/resume/verify.sh legacy-shared-receipts 2>&1 | tee "$EVIDENCE/legacy-shared-receipts.log"
      - name: Verify read-only legacy cutover previews on synthetic SQLite copies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/legacy-cutover-preview.log"
          bash ../ci/tools/ci/resume/verify.sh legacy-cutover-preview 2>&1 | tee "$log"
          for backend in tmux herdr; do
            for phase in running unknown; do
              test "$(grep -Fc "\"backend\": \"$backend\", \"phase\": \"$phase\"" "$log")" = 1
            done
          done
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$log"
          grep -Fx 'legacy-cutover-preview exit=0 group_root_removed=yes' "$EVIDENCE/results.log"
      - name: Verify both complete legacy history fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/legacy-history.log"
          bash ../ci/tools/ci/resume/verify.sh legacy-history 2>&1 | tee "$log"
          for version in 39 40; do
            for group in identity-rejections consistency-head consistency-dirty consistency-duplicate-numeric-id               owner-confirmations receipt-confirmations managed-herdr-binding reclaim-history publish-and-backup               resolution-history archive-direction controller-ack-and-high-water combined-numbering source-integrity; do
              for outcome in started passed; do
                marker="history schema=$version group=$group outcome=$outcome"
                test "$(grep -Fxc -- "$marker" "$log")" = 1
              done
            done
          done
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$log"
          grep -Fx 'legacy-history exit=0 group_root_removed=yes' "$EVIDENCE/results.log"
      - name: Verify complete offline import, publication and recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/legacy-offline-import.log"
          bash ../ci/tools/ci/resume/verify.sh legacy-offline-import 2>&1 | tee "$log"
          for pair in '39 tmux' '40 herdr'; do
            read -r version backend <<< "$pair"
            prefix="{\"syntheticPythonSchema\": \"$version\", \"legacyBackend\": \"$backend\", "
            test "$(grep -Fc -- "$prefix" "$log")" = 1
            grep -F -- "$prefix" "$log" | grep -E -- '"whitespaceLegacyRotation": true[,}]'
          done
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$log"
          grep -Fx 'legacy-offline-import exit=0 group_root_removed=yes' "$EVIDENCE/results.log"
      - name: Check four Herdr confirmation, launch ownership and stop proof sequences
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        env:
          WFC_BUILD_ID: ${{ env.PRODUCT_SHA }}
        run: |
          set -o pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/wfc-herdr-unit-XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          python=$(command -v python3)
          sha256sum --check --strict "$EVIDENCE/elf.sha256"
          "$python" -Bu ../ci/tools/ci/resume/reap.py "$scratch" "$EVIDENCE/confirmation-unit-processes.log" \
            timeout --kill-after=10s 10m cargo +1.96.1 test --release --locked --target "$TARGET" \
            --bin wfc --color never ::tests::herdr_ -- --test-threads=1 \
            2>&1 | tee "$EVIDENCE/confirmation-unit.log"
          for selector in \
            workflow::herdr::tests::herdr_confirmation_keeps_terminal_receipt_and_one_notice \
            workflow::herdr::tests::herdr_confirmation_requires_the_verified_started_writer \
            host_launch::tests::herdr_launch_spec_lifetime_follows_delivery \
            workflow::herdr::tests::herdr_offline_resume_requires_the_same_tracked_tree_stop; do
            grep -Fx "test $selector ... ok" "$EVIDENCE/confirmation-unit.log"
          done
          grep -E '^test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured;' "$EVIDENCE/confirmation-unit.log"
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$EVIDENCE/confirmation-unit.log"
          sha256sum --check --strict "$EVIDENCE/elf.sha256"
      - name: Checksum the available evidence
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          shopt -s nullglob
          files=( *.log *.sha256 )
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload Jammy handoff and process evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-herdr-shared-confirmation-r34-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
