name: Jammy pre-registration launch receipt recovery

on:
  push:
    branches: [rust-router/public-host-resume-r25-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  public-host-resume:
    name: '#37 pre-launch recovery and #13 startup receipts'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      WFC_BUILD_ID: fd4089c7f439e2ca24f1f265f848d18c51e35eda
      WFC_PRODUCT_TREE: 0f0290f248667cb5685735e7d5779cb97a8b6d24
      WFC_PRODUCT_PARENTS: d78aa6ca2d27206be02a6dbe957f945f3ca41ad2
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      EVIDENCE: ${{ github.workspace }}/linux-public-host-resume-evidence
    steps:
      - name: Record run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf 'Workflow %s\nRun %s attempt %s\nProduct %s\nTree %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$WFC_BUILD_ID" "$WFC_PRODUCT_TREE" | tee "$EVIDENCE/run.log"
          { cat /etc/os-release; getconf GNU_LIBC_VERSION; uname -a; } | tee -a "$EVIDENCE/run.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          persist-credentials: false
      - name: Check out the fixed workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          persist-credentials: false
      - name: Check out the verified native CI zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          path: native-input
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify sources and prepare the native build
        working-directory: product
        run: |
          git log -1 --format='Product %H tree %T parent %P' | tee "$EVIDENCE/sources.log"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          parents=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd' ' -)
          test "$parents" = "$WFC_PRODUCT_PARENTS"
          test "$(git rev-parse 'HEAD^{tree}')" = "$WFC_PRODUCT_TREE"
          test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C ../ci cat-file -p HEAD | sed -n '/^$/q; s/^parent //p')" = "$WFC_BUILD_ID"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          sha256sum src/tmux/launch.rs src/workflow/host/claude/tests.rs \
            tests/public_host_resume.py tests/startup_failure.py tools/check_tmux.py \
            vendor/INPUTS.sha256 ../native-input/vendor/zlib-1.3.1.tar.gz \
            | tee "$EVIDENCE/inputs.log"
          sha256sum -c vendor/INPUTS.sha256 2>&1 | tee -a "$EVIDENCE/inputs.log"
          rustup toolchain install 1.96.1 --profile minimal 2>&1 | tee "$EVIDENCE/toolchain.log"
          { rustc -vV; cargo --version; zig version; python --version; } 2>&1 \
            | tee -a "$EVIDENCE/toolchain.log"
          python tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz \
            2>&1 | tee -a "$EVIDENCE/inputs.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          {
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" | sha256sum -c
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build the fixed release CLI
        id: build
        working-directory: product
        run: |
          cargo build --release --locked --bin wfc 2>&1 | tee "$EVIDENCE/build.log"
          sha256sum target/release/wfc | tee "$EVIDENCE/binary.log" "$EVIDENCE/release-elf.sha256"
          readelf -hW -- target/release/wfc | tee -a "$EVIDENCE/binary.log"
          version=$(target/release/wfc --version)
          printf '%s\n' "$version" | tee -a "$EVIDENCE/binary.log"
          [[ "$version" == *"(Rust, x86_64-unknown-linux-gnu, release, build $WFC_BUILD_ID)" ]]
      - name: Verify tmux launch evidence from synthetic state
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          cargo test --release --locked --bin wfc 'workflow::host::claude::tests::retry_' \
            -- --nocapture 2>&1 | tee "$EVIDENCE/claude-rust.log"
          test_elf=$(sed -nE 's/^[[:space:]]*Running unittests src\/main\.rs \((target\/release\/deps\/wfc-[[:xdigit:]]+)\)[[:space:]]*$/\1/p' "$EVIDENCE/claude-rust.log")
          test -x "$test_elf"
          sha256sum -- "$test_elf" | tee "$EVIDENCE/test-elf.log"
          readelf -hW -- "$test_elf" | tee -a "$EVIDENCE/test-elf.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$EVIDENCE/claude-rust.log"
          grep -F 'workflow::host::claude::tests::retry_checks_current_and_historical_tmux_receipts_under_the_inbox_lock ... ok' "$EVIDENCE/claude-rust.log"
          grep -F 'workflow::host::claude::tests::retry_cancellation_marker_cannot_override_terminal_launch_evidence ... ok' "$EVIDENCE/claude-rust.log"
      - name: Ensure isolated tmux fixture prerequisites
        id: tmux
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          test "$(id -u)" -ne 0
          sha256sum --check --strict "$EVIDENCE/release-elf.sha256" | tee "$EVIDENCE/release-check.log"
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends tmux
          fi
          tmux -V | tee "$EVIDENCE/tmux.log"
      - name: Verify Claude recovery before and after launch registration
        if: ${{ !cancelled() && steps.tmux.outcome == 'success' }}
        working-directory: product
        run: |
          python -Bu tests/public_host_resume.py target/release/wfc \
            PublicHostResume.test_claude_retries_when_initial_launch_receipt_could_not_be_created \
            PublicHostResume.test_claude_retries_definite_spawn_failures_with_the_original_uuid \
            2>&1 | tee "$EVIDENCE/public-host-resume.log"
          grep -F "Ran 2 tests" "$EVIDENCE/public-host-resume.log"
          if grep -Eq 'skipped=' "$EVIDENCE/public-host-resume.log"; then exit 1; fi
      - name: Verify direct startup notices and stable controller message IDs
        if: ${{ !cancelled() && steps.tmux.outcome == 'success' }}
        working-directory: product
        run: |
          failed=0
          python -Bu tests/startup_failure.py target/release/wfc \
            StartupFailure.test_hosted_failures 2>&1 | tee "$EVIDENCE/startup-receipts.log" || failed=1
          python -Bu tools/check_tmux.py target/release/wfc \
            Backend.test_public_reply_and_reclaim_preserve_controller_receipts \
            2>&1 | tee "$EVIDENCE/controller-receipts.log" || failed=1
          test "$failed" = 0
          for log in startup-receipts controller-receipts; do
            grep -E 'Ran 1 test in ' "$EVIDENCE/$log.log"
            if grep -Eq 'skipped=' "$EVIDENCE/$log.log"; then exit 1; fi
          done
      - name: Checksum the evidence logs
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          shopt -s nullglob
          sha256sum -- *.log *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-public-host-resume-r25-${{ env.WFC_BUILD_ID }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
