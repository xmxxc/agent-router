name: Linux batch reclaim acceptance
on:
  push:
    branches: [rust-router/36-r15-preflight-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reclaim:
    name: '#36 fixed product and public fixtures'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WFC_BUILD_ID: f6851d283f1b8e14d6eab714ef422be4dad8d321
      PRODUCT_TREE: ae5007726611dbf9ad8563c7f3d6177729bbda60
      PRODUCT_PARENT: d06d42150c274981104055e3f998f4c987ad2aff
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      REAPER_SHA: 5ced6218637c11d9ca73fa3285a1ff98fadad6fc
      HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      TRIPLE: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: '1'
      PYTHONUTF8: '1'
      EVIDENCE: ${{ github.workspace }}/linux-reclaim-evidence
    steps:
      - name: Record run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf 'workflow=%s\nhead=%s\nrun=%s\nattempt=%s\nref=%s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" \
            | tee "$EVIDENCE/run.log"
          uname -srm | tee -a "$EVIDENCE/run.log"
      - name: Check out the CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: ci
          persist-credentials: false
      - name: Check out the pinned product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - name: Check out the verified zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: /vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check out the reviewed child reaper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REAPER_SHA }}
          path: reaper-source
          sparse-checkout: /tools/ci/tmux-r11/reap.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned Linux x86-64 Zig and Rust
        run: |
          {
            package=zig-x86_64-linux-0.16.0
            archive="$RUNNER_TEMP/$package.tar.xz"
            digest=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            verified=0
            for base in https://ziglang.org/download/0.16.0 https://zig.bcr.ist; do
              url="$base/$package.tar.xz"
              printf 'Zig source %s\n' "$url"
              if curl --fail --silent --show-error --location --retry 2 --retry-max-time 180 \
                --connect-timeout 15 --max-time 120 --output "$archive" "$url" &&
                printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict; then
                verified=1
                break
              fi
            done
            test "$verified" = 1
            sha256sum "$archive"
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            zig="$RUNNER_TEMP/$package/zig"
            test "$("$zig" version)" = 0.16.0
            "$zig" version
            printf '%s\n' "$(dirname "$zig")" >> "$GITHUB_PATH"
            printf 'ZIG_GLOBAL_CACHE_DIR=%s\n' "$RUNNER_TEMP/wfc36-zig-cache" >> "$GITHUB_ENV"
            rustup toolchain install 1.96.1 --profile minimal
            rustc +1.96.1 -vV
            cargo +1.96.1 --version
            python3 --version
            python3 -c 'import sqlite3; print("Fixture Python SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 38)'
            cc --version
          } 2>&1 | tee "$EVIDENCE/toolchain.log"
      - name: Verify source identities and prepare native build inputs
        working-directory: product
        run: |
          {
            git -C ../ci show -s --format='CI %H tree %T parent %P'
            test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git -C ../ci show -s --format=%P)" = "$WFC_BUILD_ID"
            git -C ../ci diff --name-status HEAD^ HEAD
            git show -s --format='Product %H tree %T parent %P'
            test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
            test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
            test "$(git show -s --format=%P)" = "$PRODUCT_PARENT"
            git -C ../native-input show -s --format='zlib source %H tree %T'
            test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
            git -C ../reaper-source show -s --format='Reaper source %H tree %T'
            test "$(git -C ../reaper-source rev-parse HEAD)" = "$REAPER_SHA"
            printf '%s  %s\n' 6b47d759fe6c1858bff7f47b9f974a4928af0012070376a6b2bc84ba9f8578ff \
              ../reaper-source/tools/ci/tmux-r11/reap.py | sha256sum --check --strict
            printf '%s  %s\n' 2905abced4ef3d0a96a683119fa0816ebc96ebaa49f0d090eb623517a9954666 \
              vendor/INPUTS.sha256 | sha256sum --check --strict
            test "$(wc -l < vendor/INPUTS.sha256)" -eq 100
            sha256sum --check --strict vendor/INPUTS.sha256
            sha256sum tools/check_tmux.py tests/{herdr_public,legacy_public,owner,receipts,relay}.py \
              ../ci/tools/ci/reclaim/{verify.sh,legacy_matrix.py}
            zlib="$GITHUB_WORKSPACE/native-input/vendor/zlib-1.3.1.tar.gz"
            printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c \
              "$zlib" | sha256sum --check --strict
            sha256sum "$zlib"
            python3 tools/prepare.py --zlib-archive "$zlib"
          } 2>&1 | tee "$EVIDENCE/inputs.log"
      - name: Verify and prime the pinned Wuffs package
        working-directory: product/vendor/libghostty-vt
        run: |
          {
            url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
            archive="$RUNNER_TEMP/wuffs.tar.gz"
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c \
              "$archive" | sha256sum --check --strict
            sha256sum "$archive"
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the fixed release ELF
        id: build
        working-directory: product
        run: |
          rc=0
          cargo +1.96.1 build --release --locked --bin wfc --target "$TRIPLE" \
            > "$EVIDENCE/build.stdout.log" 2> "$EVIDENCE/build.stderr.log" || rc=$?
          printf '%s\n' "$rc" | tee "$EVIDENCE/build.exit"
          cat "$EVIDENCE/build.stdout.log"
          cat "$EVIDENCE/build.stderr.log" >&2
          if ((rc != 0)); then exit "$rc"; fi
          wfc="$PWD/target/$TRIPLE/release/wfc"
          sha256sum "$wfc" | tee "$EVIDENCE/elf.sha256"
          {
            git show -s --format='Product %H tree %T parent %P'
            version=$("$wfc" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(Rust, $TRIPLE, release, build $WFC_BUILD_ID)" ]]
            readelf -hW "$wfc"
          } 2>&1 | tee "$EVIDENCE/identity.log"
      - name: Verify tmux for the private fixtures
        id: tmux
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          {
            if ! command -v tmux >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends tmux
            fi
            tmux -V
          } 2>&1 | tee "$EVIDENCE/tmux-install.log"
      - name: Verify the official Herdr 0.9.5 Linux asset
        id: herdr
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          {
            url=https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
            herdr="$RUNNER_TEMP/herdr-linux-x86_64"
            printf 'Herdr source %s\nExpected SHA-256 %s\n' "$url" "$HERDR_SHA256"
            curl --fail --silent --show-error --location --retry 3 --retry-connrefused \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$herdr"
            printf '%s  %s\n' "$HERDR_SHA256" "$herdr" | sha256sum --check --strict
            sha256sum "$herdr"
            chmod 700 "$herdr"
            version=$("$herdr" --version)
            printf '%s\n' "$version"
            test "$version" = 'herdr 0.9.5'
          } 2>&1 | tee "$EVIDENCE/herdr-release.log"
      - name: Run targeted public fixtures and baseline compatibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ci
        env:
          TMUX_READY: ${{ steps.tmux.outcome }}
          HERDR_READY: ${{ steps.herdr.outcome }}
        run: bash tools/ci/reclaim/verify.sh
      - name: Checksum all saved evidence
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload evidence including failed suites
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-reclaim-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
