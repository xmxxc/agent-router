name: Jammy bundled reply after offline import
on:
  push:
    branches: [rust-router/30-bundled-migrated-ask-reply-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  migrated-ask-reply:
    name: '#24 bundled ask and reply after legacy import'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PRODUCT_SHA: e6d2a8b1a6594474f13024b3bb9864105900bfee
      PRODUCT_TREE: 771f53c8ed37ef1894a58773991afa73ed53d36c
      PRODUCT_PARENTS: 007c76a3898a0788aa789db25a48badea92b4665 76089788946704ce226db66dfbaa481dbe505907
      INPUTS_SHA256: 1cb833d0425d57047c402387697461832a6734b3b4aebe98fb7d0b200adc2201
      INPUTS_COUNT: '139'
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      NATIVE_INPUT_TREE: 7480986f4468ffafc76b95012562945ee586b52a
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/linux-bundled-migrated-ask-reply-evidence
    steps:
      - name: Record workflow and run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW_SHA" "head=$GITHUB_SHA" \
            "ref=$GITHUB_REF" "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "job=$GITHUB_JOB" \
            "expectedProduct=$PRODUCT_SHA" "expectedTree=$PRODUCT_TREE" \
            "expectedParents=$PRODUCT_PARENTS" | tee "$EVIDENCE/run.log"
      - name: Check out the fixed workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the fixed product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the approved zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the fixed sources and product input manifest
        working-directory: product
        run: |
          {
            test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
            test "$GITHUB_REF" = refs/heads/rust-router/30-bundled-migrated-ask-reply-jammy-ci
            test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
            test "$(git -C ../ci show -s --format=%P HEAD)" = "$PRODUCT_SHA"
            ci_paths=$(git -C ../ci diff --name-only HEAD^ HEAD)
            test "$ci_paths" = "$(printf '%s\n' \
              .github/workflows/linux-bundled-migrated-ask-reply.yml \
              tools/ci/bundled-migrated-ask-reply/{APPROVED.sha256,probe.py,run.sh})"
            git -C ../ci show -s --format='ci=%H tree=%T parents=%P'
            test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
            test "$(git show -s --format=%P HEAD)" = "$PRODUCT_PARENTS"
            git show -s --format='product=%H tree=%T parents=%P'
            test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
            test "$(git -C ../native-input rev-parse 'HEAD^{tree}')" = "$NATIVE_INPUT_TREE"
            git -C ../native-input show -s --format='nativeInput=%H tree=%T'
            for checkout in . ../ci ../native-input; do
              test -z "$(git -C "$checkout" status --porcelain)"
            done
            printf '%s  %s\n' "$INPUTS_SHA256" vendor/INPUTS.sha256 | sha256sum --check --strict
            test "$(wc -l < vendor/INPUTS.sha256)" = "$INPUTS_COUNT"
            sha256sum --check --strict vendor/INPUTS.sha256
            sha256sum --check --strict ../ci/tools/ci/bundled-migrated-ask-reply/APPROVED.sha256
            sha256sum ../ci/.github/workflows/linux-bundled-migrated-ask-reply.yml
          } 2>&1 | tee "$EVIDENCE/sources.log"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the approved Zig archive
        run: |
          {
            package=zig-x86_64-linux-0.16.0
            archive="$RUNNER_TEMP/$package.tar.xz"
            digest=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            verified=0
            for base in https://ziglang.org/download/0.16.0 https://zig.bcr.ist; do
              url="$base/$package.tar.xz"
              printf 'Downloading %s\n' "$url"
              if curl --fail --silent --show-error --location --retry 2 --retry-max-time 180 \
                --connect-timeout 15 --max-time 120 --output "$archive" "$url" &&
                printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict; then
                verified=1
                break
              fi
            done
            test "$verified" = 1
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            zig_dir="$RUNNER_TEMP/$package"
            version=$("$zig_dir/zig" version)
            printf 'Zig %s\n' "$version"
            test "$version" = 0.16.0
            printf '%s\n' "$zig_dir" >> "$GITHUB_PATH"
          } 2>&1 | tee "$EVIDENCE/zig-install.log"
      - name: Prepare the fixed build toolchain
        run: |
          {
            rustup toolchain install 1.96.1 --profile minimal
            test "$(id -u)" -ne 0
            grep -Fx 'VERSION_ID="22.04"' /etc/os-release
            getconf GNU_LIBC_VERSION
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
            id -u
            test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
            systemctl --version
            command -v jq
            uname -srm
            rustc +1.96.1 -vV
            cargo +1.96.1 --version
            zig version
            python3 --version
            cc --version
          } 2>&1 | tee "$EVIDENCE/toolchain.log"
      - name: Materialize verified Ghostty and zlib sources
        working-directory: product
        run: |
          python3 tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz \
            2>&1 | tee "$EVIDENCE/native-prepare.log"
      - name: Prime the pinned Wuffs package
        working-directory: product/vendor/libghostty-vt
        run: |
          {
            url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
            archive="$RUNNER_TEMP/wuffs.tar.gz"
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" |
              sha256sum --check --strict
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the fixed release ELF
        id: build
        working-directory: product
        env:
          WFC_BUILD_ID: ${{ env.PRODUCT_SHA }}
        run: |
          {
            cargo +1.96.1 build --release --locked --target "$TARGET" --bin wfc
            install -m 0500 "target/$TARGET/release/wfc" "$EVIDENCE/wfc"
            (cd "$EVIDENCE" && sha256sum wfc | tee elf.sha256)
            version=$("$EVIDENCE/wfc" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(Rust, $TARGET, release, build $PRODUCT_SHA)" ]]
            readelf -hW "$EVIDENCE/wfc"
            readelf -VW "$EVIDENCE/wfc" > "$EVIDENCE/elf-versions.log"
            python3 - "$EVIDENCE/elf-versions.log" <<'PY' | tee "$EVIDENCE/elf-symbol-requirements.log"
          import re
          import sys
          from pathlib import Path

          names = set(re.findall(r"\bName: ((?:GLIBC|GCC)_\S+)", Path(sys.argv[1]).read_text()))
          for family in ("GLIBC", "GCC"):
              requirements = sorted(name for name in names if name.startswith(family + "_"))
              versions = [
                  tuple(map(int, name.split("_", 1)[1].split(".")))
                  for name in requirements if re.fullmatch(family + r"_[0-9]+(?:\.[0-9]+)+", name)
              ]
              highest = max(versions, default=())
              print(f"{family}_symbols={' '.join(requirements) or 'none'}")
              print(f"{family}_max={'.'.join(map(str, highest)) or 'none'}")
              if family == "GLIBC":
                  assert highest and highest <= (2, 35) and len(versions) == len(requirements)
          PY
          } 2>&1 | tee "$EVIDENCE/build.log"
      - name: Verify offline import and public ask, reply, done and ACK with one ELF
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          bash ../ci/tools/ci/bundled-migrated-ask-reply/run.sh |& tee "$EVIDENCE/fixture.log"
          grep -Fx BUNDLED_MIGRATED_ASK_REPLY_AND_CLEANUP_PASS "$EVIDENCE/fixture.log"
      - name: Checksum the available evidence
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          find . -maxdepth 1 -type f \( -name '*.log' -o -name elf.sha256 \) -print0 |
            LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          if [ -f elf.sha256 ]; then sha256sum --check --strict elf.sha256; fi
      - name: Upload Jammy migrated ask and reply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-bundled-migrated-ask-reply-${{ env.PRODUCT_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE }}/*.log
            ${{ env.EVIDENCE }}/elf.sha256
            ${{ env.EVIDENCE }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
