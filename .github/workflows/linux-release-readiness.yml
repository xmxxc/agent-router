name: Linux release readiness
on:
  push:
    branches: [rust-router/24-linux-release-847b4ea716f7-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WFC_BUILD_ID: 847b4ea716f7b0f1fe03c3a0adf52931a8400298
      PRODUCT_TREE: 219921b3e9b53766e69663c4f90f793a031aba7a
      PRODUCT_PARENTS: 312cf8bbe37e96ce574b955a63c46b910ab87a88
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      EVIDENCE: ${{ github.workspace }}/linux-release-test-evidence
    steps:
      - name: Record the trigger, product and runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -o pipefail
          mkdir -p "$EVIDENCE"
          {
            printf 'trigger=%s\nworkflow=%s\nproduct_expected=%s\nref=%s\n' \
              "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$WFC_BUILD_ID" "$GITHUB_REF"
            printf 'run=%s\nattempt=%s\njob=%s\nrunner=%s\nimage=%s/%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_ENVIRONMENT" \
              "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            uname -srm
            test "$(uname -m)" = x86_64
          } | tee "$EVIDENCE/run.log"
          cat > "$RUNNER_TEMP/wfc-test-evidence.bash" <<'BASH'
          run_test() {
            local log="$EVIDENCE/$1.log"
            shift
            local markers='private[-_]token|private-test-token|fixture-signing-key|private\.invalid|bearer[[:space:]]'
            local fields='token|secret|authorization|callback|api[_-]?key|signature|capabilityHash|nonce|ticket'
            local -a status=(0 0 0)
            "$@" 2>&1 | sed -uE \
              -e "/$markers|[[:alnum:]_]*($fields)[[:alnum:]_]*[^[:alnum:]_]{0,3}[:=]/Ic\\[redacted fixture diagnostic]" \
              -e 's/\b[[:xdigit:]]{32,}\b/[redacted hex]/g' \
              | tee "$log" || status=("${PIPESTATUS[@]}")
            local evidence_exit=0
            printf 'test_exit=%s redact_exit=%s tee_exit=%s\n' "${status[@]}" \
              | tee -a "$log" || evidence_exit=$?
            local code
            for code in "${status[@]}" "$evidence_exit"; do
              if ((code != 0)); then return "$code"; fi
            done
            return 0
          }
          BASH
      - name: Check out the frozen product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          fetch-depth: 2
          path: product
          persist-credentials: false
      - name: Check out the input verification recipe from the trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 2
          path: recipe
          sparse-checkout: /.github/ci/check-linux-release-inputs.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check out the verified native zlib input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify sources and prepare the native build
        working-directory: product
        run: |
          set -o pipefail
          {
            git -C ../recipe show -s --format='trigger=%H tree=%T parents=%P'
            test "$(git -C ../recipe rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git -C ../recipe show -s --format=%P)" = "$WFC_BUILD_ID"
            git show -s --format='product=%H tree=%T parents=%P'
            test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
            test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
            test "$(git show -s --format=%P)" = "$PRODUCT_PARENTS"
            git -C ../native-input show -s --format='native-input=%H tree=%T'
            test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          } | tee "$EVIDENCE/sources.log"
          rustup toolchain install 1.96.1 --profile minimal 2>&1 | tee "$EVIDENCE/toolchain.log"
          {
            rustc -vV
            cargo --version
            zig version
            python3 --version
          } | tee -a "$EVIDENCE/toolchain.log"
          {
            zlib=../native-input/vendor/zlib-1.3.1.tar.gz
            sha256sum Cargo.lock rust-toolchain.toml vendor/INPUTS.sha256 "$zlib" \
              tests/{owner,receipts,relay,legacy_tmux_archive,herdr_public,runtime_faults}.py
            bash ../recipe/.github/ci/check-linux-release-inputs.sh "$EVIDENCE/verified-inputs.log"
            python3 tools/prepare.py --zlib-archive "$zlib"
            # Preload the pinned Wuffs archive to avoid the observed Zig fetch resets.
            url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
            archive="$RUNNER_TEMP/wuffs.tar.gz"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c \
              "$archive" | sha256sum --check --strict
            package=$(cd vendor/libghostty-vt && zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/inputs.log"
      - name: Build the Ubuntu 24.04 test CLI
        id: build
        working-directory: product
        run: |
          set -o pipefail
          cargo build --release --locked --bin wfc 2>&1 | tee "$EVIDENCE/build.log"
          binary=target/release/wfc
          {
            sha256sum "$binary"
            stat --format='%n %s bytes' "$binary"
            readelf --file-header --dynamic "$binary"
            version=$("$binary" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(Rust, x86_64-unknown-linux-gnu, release, build $WFC_BUILD_ID)" ]]
          } | tee "$EVIDENCE/test-elf.log"
      - name: Run the unfiltered Rust workspace release tests
        id: workspace-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/wfc-test-evidence.bash"
          run_test workspace-tests cargo test --workspace --release --locked --no-fail-fast
      - name: Run the Python runtime fault tests
        id: runtime-faults
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/wfc-test-evidence.bash"
          run_test runtime-faults python3 -Bu tests/runtime_faults.py target/release/wfc
      - name: Verify controller ownership and receipt delivery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/wfc-test-evidence.bash"
          failed=0
          for fixture in owner receipts relay; do
            run_test "$fixture" python3 -Bu "tests/$fixture.py" target/release/wfc || failed=1
          done
          exit "$failed"
      - name: Verify the read-only archive and current controller receipts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/wfc-test-evidence.bash"
          run_test archive python3 -Bu tests/legacy_tmux_archive.py target/release/wfc
      - name: Verify public Herdr lifecycle on the pinned Linux server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/wfc-test-evidence.bash"
          herdr="$RUNNER_TEMP/herdr-0.9.5"
          {
            curl --fail --silent --show-error --location --retry 3 --max-time 120 \
              https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64 -o "$herdr"
            printf '%s  %s\n' 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d "$herdr" \
              | sha256sum --check --strict
            chmod 700 "$herdr"
            version=$("$herdr" --version)
            printf '%s\n' "$version"
            test "$version" = 'herdr 0.9.5'
          } 2>&1 | tee "$EVIDENCE/herdr-input.log"
          run_test herdr-public python3 -Bu tests/herdr_public.py "$herdr" target/release/wfc -v \
            PublicLifecycle.test_dispatch_current_execution_done_and_close \
            PublicLifecycle.test_named_status_during_done_then_exit \
            PublicLifecycle.test_close_after_scope_takeover_fences_stale_herdr_controls
      - name: Record step outcomes and checksum the evidence
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WORKSPACE_OUTCOME: ${{ steps.workspace-tests.outcome }}
          RUNTIME_FAULTS_OUTCOME: ${{ steps.runtime-faults.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -o pipefail
          mkdir -p "$EVIDENCE"
          cd "$EVIDENCE"
          printf 'build=%s\nworkspace_tests=%s\nruntime_faults=%s\njob_status_before_evidence_upload=%s\n' \
            "$BUILD_OUTCOME" "$WORKSPACE_OUTCOME" "$RUNTIME_FAULTS_OUTCOME" "$JOB_STATUS" | tee results.log
          sha256sum -- *.log > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-release-tests-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE }}/run.log
            ${{ env.EVIDENCE }}/sources.log
            ${{ env.EVIDENCE }}/toolchain.log
            ${{ env.EVIDENCE }}/inputs.log
            ${{ env.EVIDENCE }}/verified-inputs.log
            ${{ env.EVIDENCE }}/build.log
            ${{ env.EVIDENCE }}/test-elf.log
            ${{ env.EVIDENCE }}/workspace-tests.log
            ${{ env.EVIDENCE }}/runtime-faults.log
            ${{ env.EVIDENCE }}/owner.log
            ${{ env.EVIDENCE }}/receipts.log
            ${{ env.EVIDENCE }}/relay.log
            ${{ env.EVIDENCE }}/archive.log
            ${{ env.EVIDENCE }}/herdr-input.log
            ${{ env.EVIDENCE }}/herdr-public.log
            ${{ env.EVIDENCE }}/results.log
            ${{ env.EVIDENCE }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  package-checkpoint:
    uses: ./.github/workflows/linux-release-package.yml
    with:
      product_sha: 847b4ea716f7b0f1fe03c3a0adf52931a8400298
      product_tree: 219921b3e9b53766e69663c4f90f793a031aba7a
      product_parents: 312cf8bbe37e96ce574b955a63c46b910ab87a88
      clean_guest_runtime: true
      hosted_delegated_runtime: false
