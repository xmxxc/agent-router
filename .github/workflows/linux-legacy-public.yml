name: Linux startup confirmation and read-only close regression
on:
  push:
    branches: [rust-router/linux-ci-startup-confirmation-combination]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  legacy-public:
    name: '#13 startup confirmation and verified preflight close'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WFC_BUILD_ID: ae91101acf9e35b8abd00ddcbef78e206e648ac4
      PRODUCT_TREE: 86e932054c3d4144d14350af2cd3b2424f66a5a9
      PRODUCT_PARENTS: 59b9539181daaba91ebaa7303e15eb410fca5216 b42dca29ca28c621475af58d92675feff1956ecd
      INPUTS_SHA256: 6a6a2b230919fcb10bd075f60239bc15d992bcb2e33e833182b6f6bee779fda4
      PREVIOUS_COMBINATION_RUN: '45233642815'
      LEGACY_TREE: 034a9cad954bc952812b35bec6fef840c6abc3a1
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      TMUX_FIXTURE_SHA: 5ced6218637c11d9ca73fa3285a1ff98fadad6fc
      HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      TRIPLE: x86_64-unknown-linux-gnu
      EVIDENCE: ${{ github.workspace }}/linux-startup-confirmation-evidence
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - name: Record run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf 'Workflow %s\nRun %s attempt %s\nExpected product %s tree %s\nExpected parents %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WFC_BUILD_ID" "$PRODUCT_TREE" "$PRODUCT_PARENTS" \
            | tee "$EVIDENCE/run.log"
          printf 'Previous combination run %s\n' "$PREVIOUS_COMBINATION_RUN" | tee -a "$EVIDENCE/run.log"
          uname -a | tee -a "$EVIDENCE/run.log"
      - name: Check out the pinned product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          persist-credentials: false
      - name: Check out the verified native CI zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify sources and prepare the native build
        working-directory: product
        run: |
          git log -1 --format='Rust HEAD %H tree %T' | tee "$EVIDENCE/sources.log"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          parents=$(git cat-file -p HEAD | sed -n -e '/^$/q' -e 's/^parent //p' | paste -sd' ' -)
          test "$parents" = "$PRODUCT_PARENTS"
          printf 'Product parents %s\n' "$parents" | tee -a "$EVIDENCE/sources.log"
          legacy_tree=$(git rev-parse HEAD:crates/legacy-state)
          printf 'Legacy component tree %s\n' "$legacy_tree" | tee -a "$EVIDENCE/sources.log"
          test "$legacy_tree" = "$LEGACY_TREE"
          git -C ../native-input log -1 --format='zlib source checkout HEAD %H tree %T' | tee -a "$EVIDENCE/sources.log"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          sha256sum vendor/INPUTS.sha256 tests/{dispatch.rs,legacy_public.py,herdr_public.py,owner.py,receipts.py,relay.py,startup_failure.py} \
            tools/check_tmux.py | tee "$EVIDENCE/inputs.log"
          printf '%s  vendor/INPUTS.sha256\n' "$INPUTS_SHA256" | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          sha256sum -c vendor/INPUTS.sha256 2>&1 | tee -a "$EVIDENCE/inputs.log"
          rustup toolchain install 1.96.1 --profile minimal 2>&1 | tee "$EVIDENCE/toolchain.log"
          {
            rustc -vV
            cargo --version
            zig version
            python --version
            python -c 'import sqlite3; print("Python SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 38)'
          } 2>&1 | tee -a "$EVIDENCE/toolchain.log"
          zlib=../native-input/vendor/zlib-1.3.1.tar.gz
          sha256sum "$zlib" | tee -a "$EVIDENCE/inputs.log"
          printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c "$zlib" \
            | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          python tools/prepare.py --zlib-archive "$zlib" 2>&1 | tee -a "$EVIDENCE/inputs.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          {
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" | sha256sum -c
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the release ELF binaries
        id: build
        working-directory: product
        run: |
          cargo build --release --locked --target "$TRIPLE" -p wfc -p wfc-legacy-state 2>&1 | tee "$EVIDENCE/build.log"
          dir="target/$TRIPLE/release"
          sha256sum "$dir/wfc" "$dir/wfc-legacy-state" | tee "$EVIDENCE/binaries.log"
          version=$("$dir/wfc" --version)
          printf '%s\n' "$version" | tee -a "$EVIDENCE/binaries.log"
          [[ "$version" == *"(Rust, $TRIPLE, release, build $WFC_BUILD_ID)" ]]
          readelf -hW "$dir/wfc" "$dir/wfc-legacy-state" | tee "$EVIDENCE/elf.log"
          readelf -dW "$dir/wfc" | tee -a "$EVIDENCE/elf.log"
      - name: Ensure native tmux is available
        id: tmux
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update 2>&1 | tee "$EVIDENCE/tmux-install.log"
            sudo apt-get install -y --no-install-recommends tmux 2>&1 | tee -a "$EVIDENCE/tmux-install.log"
          fi
          tmux -V | tee "$EVIDENCE/tmux-version.log"
      - name: Check out the reviewed Linux process reaper
        id: fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TMUX_FIXTURE_SHA }}
          path: tmux-r11-fixtures
          sparse-checkout: tools/ci/tmux-r11/reap.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the reviewed reaper source
        id: fixture-identity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        working-directory: tmux-r11-fixtures
        run: |
          test "$(git rev-parse HEAD)" = "$TMUX_FIXTURE_SHA"
          git log -1 --format='Fixture HEAD %H tree %T' | tee "$EVIDENCE/backend-fixture-inputs.log"
          sha256sum tools/ci/tmux-r11/reap.py | tee -a "$EVIDENCE/backend-fixture-inputs.log"
      - name: Download and verify the Herdr 0.9.5 Linux release asset
        id: herdr-download
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          url=https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
          herdr="$RUNNER_TEMP/herdr-linux-x86_64"
          log="$EVIDENCE/herdr-release.log"
          printf 'Herdr source %s\nExpected SHA-256 %s\n' "$url" "$HERDR_SHA256" | tee "$log"
          curl --fail --silent --show-error --location --retry 3 --retry-connrefused \
            --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$herdr" 2>&1 | tee -a "$log"
          sha256sum "$herdr" | tee -a "$log"
          printf '%s  %s\n' "$HERDR_SHA256" "$herdr" | sha256sum --check --strict 2>&1 | tee -a "$log"
          chmod 700 "$herdr"
          version=$("$herdr" --version)
          printf '%s\n' "$version" | tee -a "$log"
          test "$version" = 'herdr 0.9.5'
      - name: Run real tmux ask and close ordering, replay, and ownership tests
        if: ${{ !cancelled() && steps.tmux.outcome == 'success' && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$EVIDENCE/tmux-public.log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          python -B "$reaper" python -Bu tools/check_tmux.py "target/$TRIPLE/release/wfc" -v \
            Backend.test_public_question_and_close_share_attempt_lock \
            Backend.test_public_question_reuses_terminal_evidence \
            Backend.test_managed_dispatch_callback_survives_takeover \
            Backend.test_read_only_unowned_close_replays_confirmed_archive \
            2>&1 | tee -a "$EVIDENCE/tmux-public.log"
      - name: Verify controlled startup failures and cancellation
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/startup-controlled.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" python -Bu tests/startup_failure.py "target/$TRIPLE/release/wfc" -v \
            StartupFailure.test_controlled_failures_and_completion \
            StartupFailure.test_close_distinguishes_natural_exit_and_cancellation \
            2>&1 | tee -a "$log" || status=$?
          printf 'startup-controlled exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          exit "$status"
      - name: Verify real tmux startup boundaries and script access
        if: ${{ !cancelled() && steps.tmux.outcome == 'success' && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/startup-tmux.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          test "$(id -u)" -ne 0
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" python -Bu tests/startup_failure.py "target/$TRIPLE/release/wfc" -v \
            StartupFailure.test_hosted_failures \
            StartupFailure.test_tmux_exit_follows_the_create_confirmation \
            StartupFailure.test_script_lookup_permission_failure \
            2>&1 | tee -a "$log" || status=$?
          printf 'startup-tmux exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          if grep -Eq ' \.\.\. skipped |OK \(skipped=' "$log"; then
            echo 'A required startup case was skipped' | tee -a "$log"
            exit 1
          fi
          exit "$status"
      - name: Verify script preflight close replay and owner locks as a regular user
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/startup-readonly.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          uid=$(id -u)
          test "$uid" -ne 0
          printf 'Ordinary runner UID %s\n' "$uid" | tee -a "$log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" python -Bu tests/startup_failure.py "target/$TRIPLE/release/wfc" -v \
            StartupFailure.test_script_preflight_close_replays_from_read_only_history \
            StartupFailure.test_managed_script_preflight_close_keeps_scope_lock \
            2>&1 | tee -a "$log" || status=$?
          printf 'startup-readonly exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          if grep -Eq ' \.\.\. skipped |OK \(skipped=' "$log"; then
            echo 'A required read-only case was skipped' | tee -a "$log"
            exit 1
          fi
          exit "$status"
      - name: Verify startup receipt and observation unit cases
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/startup-unit.log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" cargo test --locked --release --target "$TRIPLE" --bin wfc \
            startup -- --test-threads=1 2>&1 | tee "$log" || status=$?
          printf 'startup-unit exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          if (( status != 0 )); then
            exit "$status"
          fi
          for case in \
            workflow::backend::tests::startup_terminal_notice_requires_the_selected_launch_and_outcome \
            workflow::messages::tests::startup_receipt_with_report_does_not_count_as_done \
            workflow::startup::tests::startup_publication_uses_the_current_attempt_and_one_durable_key \
            workflow::startup::tests::unreaped_exit_keeps_creation_identity_across_a_slow_started_receipt \
            workflow::worker_owner::tests::startup_observes_natural_exit_during_controlled_publication
          do
            grep -Fx "test $case ... ok" "$log"
          done
      - name: Run focused public commands with a real Herdr protocol 22 service
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.herdr-download.outcome == 'success' && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$EVIDENCE/herdr-public.log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          python -B "$reaper" python -Bu tests/herdr_public.py "$RUNNER_TEMP/herdr-linux-x86_64" \
            "target/$TRIPLE/release/wfc" -v \
            PublicLifecycle.test_question_replays_after_herdr_close_intent \
            PublicLifecycle.test_close_during_first_done_git_sample \
            PublicLifecycle.test_close_after_scope_takeover_fences_stale_herdr_controls \
            PublicLifecycle.test_dispatch_current_execution_done_and_close \
            PublicLifecycle.test_named_status_during_done_then_exit \
            2>&1 | tee -a "$EVIDENCE/herdr-public.log"
      - name: Run focused owner takeover and scoped delivery tests
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$EVIDENCE/owner.log"
          test "$(id -u)" -ne 0
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          python -B "$reaper" python -Bu - "target/$TRIPLE/release/wfc" \
            test_takeover_fences_wait_and_ack_but_worker_keeps_its_callback \
            test_takeover_waits_for_scoped_delivery_and_unregisters_detached_relay \
            test_question_requires_current_owner_or_original_worker_callback \
            test_startup_preflight_rechecks_scope_owner \
            <<'PYTEST' 2>&1 | tee -a "$EVIDENCE/owner.log"
          import sys
          import unittest
          test_names = sys.argv[2:]
          assert len(test_names) == 4
          sys.path.insert(0, "tests")
          from owner import Owner
          suite = unittest.TestSuite(Owner(test) for test in test_names)
          sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PYTEST
      - name: Run focused legacy and scoped receipt tests
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$EVIDENCE/receipts.log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          python -B "$reaper" python -Bu tests/receipts.py "target/$TRIPLE/release/wfc" -v \
            Receipts.test_mixed_legacy_inbox Receipts.test_scoped_snapshot_survives_confirmation \
            2>&1 | tee -a "$EVIDENCE/receipts.log"
      - name: Run focused relay claim and old assignment tests
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$EVIDENCE/relay.log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          python -B "$reaper" python -Bu tests/relay.py "target/$TRIPLE/release/wfc" -v \
            Relay.test_two_relays_and_wait_claim_once_and_resolution_wins \
            Relay.test_scoped_delivery_beside_complete_and_truncated_reservations \
            Relay.test_question_envelope_matches_python_json_separators \
            Relay.test_startup_failure_uses_the_existing_scope_and_ack \
            2>&1 | tee -a "$EVIDENCE/relay.log"
      - name: Run exact Rust dispatch selectors for ask and controlled close
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/dispatch-tests.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          failed=0
          for selector in \
            question_short_help_prefixes_do_not_publish \
            controlled_close_replays_from_a_read_only_archive \
            controlled_pending_close_rejects_new_question_and_replays_original
          do
            printf 'Dispatch test %s\n' "$selector" | tee -a "$log"
            cargo test --release --locked --target "$TRIPLE" --test dispatch "$selector" -- --exact \
              2>&1 | tee -a "$log" || failed=1
            if ! grep -Fxq "test $selector ... ok" "$log"; then
              printf 'No passing result for %s\n' "$selector" | tee -a "$log"
              failed=1
            fi
          done
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee -a "$log"
          exit "$failed"
      - name: Checksum the evidence logs
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          sha256sum -- *.log > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-startup-confirmation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
