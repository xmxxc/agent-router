name: Linux Herdr coverage for the legacy and ownership combination
on:
  push:
    branches: [rust-router/linux-ci-legacy-owner-herdr]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  herdr-combination:
    name: '#30 and #16 Herdr combination coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WFC_BUILD_ID: a4991653ea41a96df6e39e95da661a1c29bd73fc
      PRODUCT_TREE: eccd654c8068bd9b07360b6f1bd2fe7c5f66bce4
      LEGACY_TREE: 034a9cad954bc952812b35bec6fef840c6abc3a1
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      REAPER_SHA: 5ced6218637c11d9ca73fa3285a1ff98fadad6fc
      HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      TRIPLE: x86_64-unknown-linux-gnu
      EVIDENCE: ${{ github.workspace }}/linux-legacy-owner-herdr-evidence
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - name: Record run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf 'Workflow %s\nRun %s attempt %s\nExpected product %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WFC_BUILD_ID" | tee "$EVIDENCE/run.log"
          uname -a | tee -a "$EVIDENCE/run.log"
      - name: Check out the pinned product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          persist-credentials: false
      - name: Check out the verified native CI zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify sources and prepare the native build
        working-directory: product
        run: |
          git log -1 --format='Rust HEAD %H tree %T' | tee "$EVIDENCE/sources.log"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          legacy_tree=$(git rev-parse HEAD:crates/legacy-state)
          printf 'Legacy component tree %s\n' "$legacy_tree" | tee -a "$EVIDENCE/sources.log"
          test "$legacy_tree" = "$LEGACY_TREE"
          git -C ../native-input log -1 --format='zlib source checkout HEAD %H tree %T' | tee -a "$EVIDENCE/sources.log"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          sha256sum vendor/INPUTS.sha256 tests/herdr_public.py crates/herdr/tests/live.py | tee "$EVIDENCE/inputs.log"
          sha256sum -c vendor/INPUTS.sha256 2>&1 | tee -a "$EVIDENCE/inputs.log"
          rustup toolchain install 1.96.1 --profile minimal 2>&1 | tee "$EVIDENCE/toolchain.log"
          {
            rustc -vV
            cargo --version
            zig version
            python --version
          } 2>&1 | tee -a "$EVIDENCE/toolchain.log"
          zlib=../native-input/vendor/zlib-1.3.1.tar.gz
          sha256sum "$zlib" | tee -a "$EVIDENCE/inputs.log"
          python tools/prepare.py --zlib-archive "$zlib" 2>&1 | tee -a "$EVIDENCE/inputs.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          {
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" | sha256sum -c
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the release wfc ELF
        id: build
        working-directory: product
        run: |
          cargo build --release --locked --target "$TRIPLE" -p wfc --bin wfc 2>&1 | tee "$EVIDENCE/build.log"
          dir="target/$TRIPLE/release"
          sha256sum "$dir/wfc" | tee "$EVIDENCE/binaries.log"
          version=$("$dir/wfc" --version)
          printf '%s\n' "$version" | tee -a "$EVIDENCE/binaries.log"
          [[ "$version" == *"(Rust, $TRIPLE, release, build $WFC_BUILD_ID)" ]]
          readelf -hW "$dir/wfc" | tee "$EVIDENCE/elf.log"
      - name: Check out the reviewed child reaper
        id: reaper-source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REAPER_SHA }}
          path: reaper-source
          sparse-checkout: /tools/ci/tmux-r11/reap.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the reviewed child reaper
        id: reaper-verified
        if: ${{ !cancelled() && steps.reaper-source.outcome == 'success' }}
        working-directory: reaper-source
        run: |
          test "$(git rev-parse HEAD)" = "$REAPER_SHA"
          git log -1 --format='Fixture HEAD %H tree %T' | tee "$EVIDENCE/reaper-inputs.log"
          sha256sum tools/ci/tmux-r11/reap.py | tee -a "$EVIDENCE/reaper-inputs.log"
      - name: Download and verify the Herdr 0.9.5 Linux release asset
        id: herdr-download
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          url=https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
          herdr="$RUNNER_TEMP/herdr-linux-x86_64"
          {
            printf 'Herdr source %s\nExpected SHA-256 %s\n' "$url" "$HERDR_SHA256"
            curl --fail --silent --show-error --location --retry 3 --retry-connrefused \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$herdr"
            printf '%s  %s\n' "$HERDR_SHA256" "$herdr" | sha256sum --check --strict
            chmod 700 "$herdr"
            version=$("$herdr" --version)
            printf '%s\n' "$version"
            test "$version" = 'herdr 0.9.5'
          } 2>&1 | tee "$EVIDENCE/herdr-release.log"
      - name: Run focused public commands with a real Herdr protocol 22 service
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.herdr-download.outcome == 'success' && steps.reaper-verified.outcome == 'success' }}
        working-directory: product
        run: |
          head -n 1 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$EVIDENCE/herdr-public.log"
          reaper="$GITHUB_WORKSPACE/reaper-source/tools/ci/tmux-r11/reap.py"
          python -B "$reaper" python -Bu tests/herdr_public.py "$RUNNER_TEMP/herdr-linux-x86_64" \
            "target/$TRIPLE/release/wfc" -v \
            PublicLifecycle.test_dispatch_current_execution_done_and_close \
            PublicLifecycle.test_named_status_during_done_then_exit \
            PublicLifecycle.test_done_receipt_and_active_list_through_close \
            PublicLifecycle.test_legacy_authority_or_later_round_is_left_pending \
            PublicLifecycle.test_close_after_scope_takeover_fences_stale_herdr_controls \
            2>&1 | tee -a "$EVIDENCE/herdr-public.log"
          grep -Eq '^Ran 5 tests in ' "$EVIDENCE/herdr-public.log"
          grep -Fxq 'OK' "$EVIDENCE/herdr-public.log"
      - name: Checksum the evidence logs
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          sha256sum -- *.log > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-30-owner-herdr-${{ env.WFC_BUILD_ID }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
