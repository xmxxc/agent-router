name: Linux durable startup notice recovery
on:
  push:
    branches: [rust-router/linux-ci-startup-durable-combination]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  legacy-public:
    name: '#13 durable startup notice recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WFC_BUILD_ID: 007a6ea77be8bf6eb0b560b6bccaa6c667b29050
      PRODUCT_TREE: 02390df6c643dadf1a711e5965e5ab262b350b79
      PRODUCT_PARENTS: ae91101acf9e35b8abd00ddcbef78e206e648ac4 19156e8f0f97936a0e449cd2412f05165c2c55b9
      INPUTS_SHA256: d18bda1d73efc1bba8643cb2ccc312de89f2e353e6687d95db182eee1fdc271b
      PREVIOUS_COMBINATION_RUN: '45237829076'
      LEGACY_TREE: 034a9cad954bc952812b35bec6fef840c6abc3a1
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      TMUX_FIXTURE_SHA: 5ced6218637c11d9ca73fa3285a1ff98fadad6fc
      TRIPLE: x86_64-unknown-linux-gnu
      EVIDENCE: ${{ github.workspace }}/linux-startup-durable-evidence
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - name: Record run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf 'Workflow %s\nRun %s attempt %s\nExpected product %s tree %s\nExpected parents %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WFC_BUILD_ID" "$PRODUCT_TREE" "$PRODUCT_PARENTS" \
            | tee "$EVIDENCE/run.log"
          printf 'Previous combination run %s\n' "$PREVIOUS_COMBINATION_RUN" | tee -a "$EVIDENCE/run.log"
          uname -a | tee -a "$EVIDENCE/run.log"
      - name: Check out the pinned product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          persist-credentials: false
      - name: Check out the verified native CI zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify sources and prepare the native build
        working-directory: product
        run: |
          git log -1 --format='Rust HEAD %H tree %T' | tee "$EVIDENCE/sources.log"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          parents=$(git cat-file -p HEAD | sed -n -e '/^$/q' -e 's/^parent //p' | paste -sd' ' -)
          test "$parents" = "$PRODUCT_PARENTS"
          printf 'Product parents %s\n' "$parents" | tee -a "$EVIDENCE/sources.log"
          legacy_tree=$(git rev-parse HEAD:crates/legacy-state)
          printf 'Legacy component tree %s\n' "$legacy_tree" | tee -a "$EVIDENCE/sources.log"
          test "$legacy_tree" = "$LEGACY_TREE"
          git -C ../native-input log -1 --format='zlib source checkout HEAD %H tree %T' | tee -a "$EVIDENCE/sources.log"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          sha256sum vendor/INPUTS.sha256 tests/{receipts.py,relay.py,startup_failure.py} | tee "$EVIDENCE/inputs.log"
          printf '%s  vendor/INPUTS.sha256\n' "$INPUTS_SHA256" | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          sha256sum -c vendor/INPUTS.sha256 2>&1 | tee -a "$EVIDENCE/inputs.log"
          rustup toolchain install 1.96.1 --profile minimal 2>&1 | tee "$EVIDENCE/toolchain.log"
          {
            rustc -vV
            cargo --version
            zig version
            python --version
            python -c 'import sqlite3; print("Python SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 38)'
          } 2>&1 | tee -a "$EVIDENCE/toolchain.log"
          zlib=../native-input/vendor/zlib-1.3.1.tar.gz
          sha256sum "$zlib" | tee -a "$EVIDENCE/inputs.log"
          printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c "$zlib" \
            | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          python tools/prepare.py --zlib-archive "$zlib" 2>&1 | tee -a "$EVIDENCE/inputs.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          {
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" | sha256sum -c
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the release ELF binaries
        id: build
        working-directory: product
        run: |
          cargo build --release --locked --target "$TRIPLE" -p wfc -p wfc-legacy-state 2>&1 | tee "$EVIDENCE/build.log"
          dir="target/$TRIPLE/release"
          sha256sum "$dir/wfc" "$dir/wfc-legacy-state" | tee "$EVIDENCE/binaries.log"
          version=$("$dir/wfc" --version)
          printf '%s\n' "$version" | tee -a "$EVIDENCE/binaries.log"
          [[ "$version" == *"(Rust, $TRIPLE, release, build $WFC_BUILD_ID)" ]]
          readelf -hW "$dir/wfc" "$dir/wfc-legacy-state" | tee "$EVIDENCE/elf.log"
          readelf -dW "$dir/wfc" | tee -a "$EVIDENCE/elf.log"
      - name: Ensure native tmux is available
        id: tmux
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update 2>&1 | tee "$EVIDENCE/tmux-install.log"
            sudo apt-get install -y --no-install-recommends tmux 2>&1 | tee -a "$EVIDENCE/tmux-install.log"
          fi
          tmux -V | tee "$EVIDENCE/tmux-version.log"
      - name: Check out the reviewed Linux process reaper
        id: fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TMUX_FIXTURE_SHA }}
          path: tmux-r11-fixtures
          sparse-checkout: tools/ci/tmux-r11/reap.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the reviewed reaper source
        id: fixture-identity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        working-directory: tmux-r11-fixtures
        run: |
          test "$(git rev-parse HEAD)" = "$TMUX_FIXTURE_SHA"
          git log -1 --format='Fixture HEAD %H tree %T' | tee "$EVIDENCE/backend-fixture-inputs.log"
          sha256sum tools/ci/tmux-r11/reap.py | tee -a "$EVIDENCE/backend-fixture-inputs.log"
      - name: Verify real tmux notice recovery and ownership
        if: ${{ !cancelled() && steps.tmux.outcome == 'success' && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/startup-recovery.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          test "$(id -u)" -ne 0
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" python -Bu tests/startup_failure.py "target/$TRIPLE/release/wfc" -v \
            StartupFailure.test_startup_notice_recovers_after_dispatch_interruption \
            StartupFailure.test_startup_notice_recovers_after_ledger_write_failure \
            StartupFailure.test_tmux_exit_follows_the_create_confirmation \
            StartupFailure.test_managed_startup_recovery_rechecks_owner \
            2>&1 | tee -a "$log" || status=$?
          printf 'startup-recovery exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          if grep -Eq ' \.\.\. skipped |OK \(skipped=' "$log"; then
            echo 'A required startup case was skipped' | tee -a "$log"
            exit 1
          fi
          if (( status != 0 )); then
            exit "$status"
          fi
          grep -E '^Ran 4 tests in ' "$log"
      - name: Verify startup receipt and observation unit cases
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/startup-unit.log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" cargo test --locked --release --target "$TRIPLE" --bin wfc \
            startup -- --test-threads=1 2>&1 | tee "$log" || status=$?
          printf 'startup-unit exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          if (( status != 0 )); then
            exit "$status"
          fi
          for case in \
            workflow::backend::tests::startup_terminal_notice_requires_the_selected_launch_and_outcome \
            workflow::messages::startup_recovery_tests::startup_recovery_rejects_replaced_assignment_and_preserves_existing_question \
            workflow::messages::tests::startup_receipt_with_report_does_not_count_as_done \
            workflow::startup::tests::startup_publication_uses_the_current_attempt_and_one_durable_key \
            workflow::startup::tests::unreaped_exit_keeps_creation_identity_across_a_slow_started_receipt \
            workflow::worker_owner::tests::startup_observes_natural_exit_during_controlled_publication
          do
            grep -Fx "test $case ... ok" "$log"
          done
      - name: Run focused legacy and scoped receipt tests
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/receipts.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" python -Bu tests/receipts.py "target/$TRIPLE/release/wfc" -v \
            Receipts.test_mixed_legacy_inbox Receipts.test_scoped_snapshot_survives_confirmation \
            2>&1 | tee -a "$log" || status=$?
          printf 'receipts exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          exit "$status"
      - name: Run focused relay claim and old assignment tests
        if: ${{ !cancelled() && steps.fixture-identity.outcome == 'success' }}
        working-directory: product
        run: |
          log="$EVIDENCE/relay.log"
          head -n 2 "$EVIDENCE/binaries.log" | sha256sum --check --strict | tee "$log"
          reaper="$GITHUB_WORKSPACE/tmux-r11-fixtures/tools/ci/tmux-r11/reap.py"
          status=0
          python -B "$reaper" python -Bu tests/relay.py "target/$TRIPLE/release/wfc" -v \
            Relay.test_two_relays_and_wait_claim_once_and_resolution_wins \
            Relay.test_scoped_delivery_beside_complete_and_truncated_reservations \
            Relay.test_question_envelope_matches_python_json_separators \
            Relay.test_startup_failure_uses_the_existing_scope_and_ack \
            Relay.test_deadline_bounds_locked_inbox_and_slow_queue \
            2>&1 | tee -a "$log" || status=$?
          printf 'relay exit=%s\n' "$status" | tee -a "$EVIDENCE/startup-results.log"
          exit "$status"
      - name: Checksum the evidence logs
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          sha256sum -- *.log > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-startup-durable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
