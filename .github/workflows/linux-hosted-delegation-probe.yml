name: Linux hosted cgroup delegation probe
on:
  push:
    branches: [rust-router/linux-hosted-delegation-probe]

permissions:
  contents: read

jobs:
  delegation:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check the VM and its cgroup v2 mount
        shell: bash
        run: |
          pid1=$(ps -p 1 -o comm=)
          filesystem=$(stat -f -c '%T' /sys/fs/cgroup)
          printf 'PID 1: %s\nCgroup filesystem: %s\n' "$pid1" "$filesystem"
          test "$pid1" = systemd
          test "$filesystem" = cgroup2fs
          printf 'VM controllers: '
          cat /sys/fs/cgroup/cgroup.controllers

      - name: Run an ordinary user in a dedicated delegated service
        shell: bash
        run: |
          test "$(id -u)" -gt 0
          unit="wfc-ci-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo systemd-run --unit="$unit" --wait --pipe --collect             --property=Type=exec --property="User=$(id -un)" --property=Delegate=yes             /usr/bin/bash -euo pipefail -c '
              expected_uid=$1
              test "$(id -u)" = "$expected_uid"
              test "$expected_uid" -gt 0
              IFS= read -r membership < "/proc/$$/cgroup"
              [[ "$membership" == 0::/system.slice/wfc-ci-probe-*.service ]]
              group=${membership#0::}
              root="/sys/fs/cgroup$group"
              printf "Probe UID: %s\nDelegated cgroup: %s\n" "$expected_uid" "$group"
              test -w "$root"
              test -w "$root/cgroup.procs"
              test -e "$root/cgroup.kill"
              test -c /dev/ptmx
              printf "Delegated controllers: "
              cat "$root/cgroup.controllers"
              child="$root/wfc-probe"
              mkdir -- "$child"
              trap '\''rmdir -- "$child"'\'' EXIT
              test -w "$child/cgroup.procs"
              test -w "$child/cgroup.kill"
              /usr/bin/bash -eu -c '\''
                printf "%s\n" "$$" > "$1/cgroup.procs"
                IFS= read -r observed < "/proc/$$/cgroup"
                test "$observed" = "0::$2"
              '\'' probe-child "$child" "$group/wfc-probe"
              rmdir -- "$child"
              trap - EXIT
              printf "WFC_DELEGATED_USER_PASS\n"
            ' probe-service "$(id -u)"
