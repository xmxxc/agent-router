name: Jammy Herdr close after offline replacement and online continuation

on:
  push:
    branches: [rust-router/32-herdr-current-close-r27-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  public-herdr-current-close:
    name: '#32 Herdr closes the current execution after replacement'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      WFC_BUILD_ID: e16a84d5315d5c1604b325ec30824ec2de5f89f1
      WFC_PRODUCT_TREE: 4e4f92287cf5a18511b28bf88046c2aa6953808a
      WFC_PRODUCT_PARENTS: aaa296f5f710c55f5b2c1eae389beb497b7268a7
      WFC_INPUTS_SHA256: 007575d3d9a30a9aa1d13cfdd90fea2d80894551dce62272ab324d6ff7d9bdef
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      HERDR_RELEASE_URL: https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
      HERDR_RELEASE_SHA: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      EVIDENCE: ${{ github.workspace }}/linux-herdr-current-close-evidence
    steps:
      - name: Record run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf 'Workflow %s\nRun %s attempt %s\nProduct %s\nTree %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$WFC_BUILD_ID" "$WFC_PRODUCT_TREE" | tee "$EVIDENCE/run.log"
          { cat /etc/os-release; getconf GNU_LIBC_VERSION; uname -a; id -u; } | tee -a "$EVIDENCE/run.log"
          test "$(id -u)" -ne 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          persist-credentials: false
      - name: Check out the CI-only runner helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          persist-credentials: false
      - name: Check out the verified native CI zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          path: native-input
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify sources and prepare the native build
        working-directory: product
        run: |
          git show -s --format='Product %H tree %T' | tee "$EVIDENCE/sources.log"
          git -C ../ci show -s --format='CI %H tree %T' | tee -a "$EVIDENCE/sources.log"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$WFC_PRODUCT_TREE"
          parents=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd' ' -)
          printf 'Product parents %s\n' "$parents" | tee -a "$EVIDENCE/sources.log"
          test "$parents" = "$WFC_PRODUCT_PARENTS"
          test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C ../ci cat-file -p HEAD | sed -n '/^$/q; s/^parent //p')" = "$WFC_BUILD_ID"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c \
            ../native-input/vendor/zlib-1.3.1.tar.gz | sha256sum --check --strict | tee "$EVIDENCE/inputs.log"
          printf '%s  %s\n' "$WFC_INPUTS_SHA256" vendor/INPUTS.sha256 | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          sha256sum --check --strict vendor/INPUTS.sha256 | tee -a "$EVIDENCE/inputs.log"
          sha256sum tests/herdr_public.py crates/herdr/tests/{continue_worker,live}.py \
            crates/herdr/src/{lib,screen}.rs src/workflow/{backend,assignment,input,herdr,messages,resume}.rs \
            ../ci/.github/workflows/linux-herdr-live-nudge.yml ../ci/tools/ci/herdr-next-task/*.py | tee -a "$EVIDENCE/inputs.log"
          sha256sum ../ci/tools/ci/resume/{check_offline_resume,resume_worker}.py | tee -a "$EVIDENCE/inputs.log"
          rustup toolchain install 1.96.1 --profile minimal 2>&1 | tee "$EVIDENCE/toolchain.log"
          { rustc +1.96.1 -vV; cargo +1.96.1 --version; zig version; python --version; } | tee -a "$EVIDENCE/toolchain.log"
          test "$(zig version)" = 0.16.0
          python tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz 2>&1 | tee -a "$EVIDENCE/inputs.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          {
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" | sha256sum --check --strict
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build the fixed release CLI
        id: build
        working-directory: product
        run: |
          cargo +1.96.1 build --release --locked --bin wfc 2>&1 | tee "$EVIDENCE/build.log"
          sha256sum target/release/wfc | tee "$EVIDENCE/release-elf.sha256"
          readelf -hW -- target/release/wfc | tee "$EVIDENCE/binary.log"
          version=$(target/release/wfc --version)
          printf '%s\n' "$version" | tee -a "$EVIDENCE/binary.log"
          [[ "$version" == *"(Rust, x86_64-unknown-linux-gnu, release, build $WFC_BUILD_ID)" ]]
      - name: Verify Herdr input ordering, authorization, and screen evidence
        working-directory: product
        run: |
          selectors=(
            tests::input_authorization_precedes_final_observation
            tests::input_write_is_skipped_when_final_authorization_rejects
            screen::tests::codex_nudge_confirmation_distinguishes_visible_input_from_an_archived_copy
          )
          printf '%s\n' "${selectors[@]}" | tee "$EVIDENCE/herdr-unit-selectors.log"
          for selector in "${selectors[@]}"; do
            cargo +1.96.1 test --release --locked -p wfc-herdr --lib \
              "$selector" -- --exact 2>&1 | tee -a "$EVIDENCE/herdr-input-order.log"
            grep -Fx "test $selector ... ok" "$EVIDENCE/herdr-input-order.log"
          done
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed;' "$EVIDENCE/herdr-input-order.log")" -eq "${#selectors[@]}"
      - name: Verify input recovery, launch confirmation and stop proof
        working-directory: product
        run: |
          workflow_selectors=(
            workflow::input::tests::write_fence_precedes_final_owner_check
            workflow::input::recovery::tests::proof_recovers_only_the_staged_input
            workflow::input::tests::herdr_rejected_first_write_delivers_proof_and_recovers_staged_input
            workflow::herdr::tests::herdr_confirmation_keeps_terminal_receipt_and_one_notice
            workflow::herdr::tests::herdr_confirmation_requires_the_verified_started_writer
            host_launch::tests::herdr_launch_spec_lifetime_follows_delivery
            workflow::herdr::tests::herdr_offline_resume_requires_the_same_tracked_tree_stop
          )
          printf '%s\n' "${workflow_selectors[@]}" | tee "$EVIDENCE/workflow-unit-selector.log"
          for selector in "${workflow_selectors[@]}"; do
            cargo +1.96.1 test --release --locked --bin wfc "$selector" -- --exact \
              2>&1 | tee -a "$EVIDENCE/workflow-input-order.log"
            grep -Fx "test $selector ... ok" "$EVIDENCE/workflow-input-order.log"
          done
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed;' "$EVIDENCE/workflow-input-order.log")" -eq "${#workflow_selectors[@]}"
      - name: Download and verify pinned Herdr
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: herdr
        run: |
          asset="$RUNNER_TEMP/herdr-v0.9.5"
          {
            printf 'Herdr source %s\n' "$HERDR_RELEASE_URL"
            curl --fail --silent --show-error --location --retry 2 --retry-max-time 150 \
              --connect-timeout 15 --max-time 100 --output "$asset" "$HERDR_RELEASE_URL"
            printf '%s  %s\n' "$HERDR_RELEASE_SHA" "$asset" | sha256sum --check --strict
            chmod 700 "$asset"
            readelf -hW "$asset"
            version=$("$asset" --version)
            printf '%s\n' "$version"
            test "$version" = 'herdr 0.9.5'
            printf 'HERDR_BIN=%s\n' "$asset" >> "$GITHUB_ENV"
          } 2>&1 | tee "$EVIDENCE/herdr.log"
      - name: Verify adjacent online Herdr input and close receipts
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          sha256sum --check --strict "$EVIDENCE/release-elf.sha256" | tee "$EVIDENCE/test-binary.log"
          selectors=(
            PublicLifecycle.test_continue_completes_a_new_task_in_the_original_herdr_pane
            PublicLifecycle.test_nudge_on_live_herdr_worker_replays_only_the_original_key
            PublicLifecycle.test_done_receipt_and_active_list_through_close
            PublicLifecycle.test_close_archive_requires_the_original_root_writer
            PublicLifecycle.test_named_status_during_done_then_exit
          )
          printf '%s\n' "${selectors[@]}" | tee "$EVIDENCE/selectors.log"
          result=0
          python -Bu ../ci/tools/ci/herdr-next-task/reap.py python -Bu tests/herdr_public.py \
            "$HERDR_BIN" target/release/wfc -v "${selectors[@]}" \
            > "$EVIDENCE/herdr-stdout.log" 2> "$EVIDENCE/public-herdr.log" || result=$?
          cat "$EVIDENCE/herdr-stdout.log" "$EVIDENCE/public-herdr.log"
          test "$result" -eq 0
          for selector in "${selectors[@]}"; do
            grep -E "^${selector#*.} .+ \.\.\. ok$" "$EVIDENCE/public-herdr.log"
          done
          grep -F 'Ran 5 tests' "$EVIDENCE/public-herdr.log"
          grep -Fx 'OK' "$EVIDENCE/public-herdr.log"
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$EVIDENCE/herdr-stdout.log"
      - name: Verify offline replacement, online continuation and close of the replacement pane
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        working-directory: product
        run: |
          sha256sum --check --strict "$EVIDENCE/release-elf.sha256" | tee "$EVIDENCE/offline-test-binary.log"
          selectors=(
            OfflineResume.test_public_resume_reuses_saved_chat_and_task_once
            OfflineResume.test_public_resume_without_confirmed_stop_does_not_launch
            OfflineResume.test_public_resume_then_continue_uses_only_the_replacement_pane
          )
          printf '%s\n' "${selectors[@]}" | tee "$EVIDENCE/offline-selectors.log"
          result=0
          PYTHONPATH="$PWD/tests" python -Bu ../ci/tools/ci/herdr-next-task/reap.py \
            python -Bu ../ci/tools/ci/resume/check_offline_resume.py "$HERDR_BIN" target/release/wfc -v "${selectors[@]}" \
            > "$EVIDENCE/offline-stdout.log" 2> "$EVIDENCE/public-offline.log" || result=$?
          cat "$EVIDENCE/offline-stdout.log" "$EVIDENCE/public-offline.log"
          test "$result" -eq 0
          for selector in "${selectors[@]}"; do
            grep -E "^${selector#*.} .+ \.\.\. ok$" "$EVIDENCE/public-offline.log"
          done
          grep -F 'Ran 3 tests' "$EVIDENCE/public-offline.log"
          grep -Fx 'OK' "$EVIDENCE/public-offline.log"
          grep -Fx 'Own descendants reaped: ECHILD, extra cleanup signals: 0' "$EVIDENCE/offline-stdout.log"
      - name: Checksum the evidence logs
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          shopt -s nullglob
          sha256sum -- *.log *.sha256 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-herdr-current-close-${{ env.WFC_BUILD_ID }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
