name: Jammy bundled Codex continuation

on:
  push:
    branches: [rust-router/32-bundled-codex-continue-r30-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bundled-codex-continue:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      WFC_BUILD_ID: 48eea2ca0b495c27668049b6ecf2b226bc09f5b1
      PRODUCT_TREE: a0c24c441dfdd41687695ad1aa904dd3f2ea981c
      PRODUCT_PARENT: fadf7343f0eb16f48bf230ead4b5293300af6817
      INPUTS_SHA256: 68450785f64a5f4fd97d7d1bd45fa7c5cde53a3b7b2759f1d0e0bc4304d77504
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      EVIDENCE: ${{ github.workspace }}/bundled-codex-continue-evidence
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - name: Record the hosted run
        run: |
          mkdir -p "$EVIDENCE"
          printf 'workflow %s\nrun %s attempt %s\nproduct %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WFC_BUILD_ID" \
            | tee "$EVIDENCE/run.log"
          { cat /etc/os-release; uname -a; getconf GNU_LIBC_VERSION; id -u; } | tee -a "$EVIDENCE/run.log"
          test "$(id -u)" -gt 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify product and CI provenance
        working-directory: product
        run: |
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git show -s --format=%P HEAD)" = "$PRODUCT_PARENT"
          test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C ../ci show -s --format=%P HEAD)" = "$WFC_BUILD_ID"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          git log -1 --format='product %H tree %T parent %P' | tee "$EVIDENCE/product.log"
          git -C ../ci log -1 --format='ci %H tree %T parent %P' | tee -a "$EVIDENCE/product.log"
          printf '%s  %s\n' "$INPUTS_SHA256" vendor/INPUTS.sha256 | sha256sum --check --strict | tee "$EVIDENCE/inputs.log"
          sha256sum --check --strict vendor/INPUTS.sha256 | tee -a "$EVIDENCE/inputs.log"
          printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c \
            ../native-input/vendor/zlib-1.3.1.tar.gz | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          sha256sum ../ci/.github/workflows/linux-bundled-codex-continue.yml | tee -a "$EVIDENCE/inputs.log"
      - name: Prepare the pinned native dependencies
        working-directory: product
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          { rustc +1.96.1 -vV; cargo +1.96.1 --version; zig version; } | tee "$EVIDENCE/toolchain.log"
          test "$(zig version)" = 0.16.0
          python tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz \
            2>&1 | tee "$EVIDENCE/prepare.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 15 --max-time 60 \
            https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz -o "$archive"
          printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" \
            | sha256sum --check --strict | tee "$EVIDENCE/wuffs.log"
          package=$(zig fetch "$archive")
          test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
      - name: Build and identify the single release ELF
        working-directory: product
        run: |
          cargo +1.96.1 build --release --locked --bin wfc 2>&1 | tee "$EVIDENCE/build.log"
          install -m 0500 target/release/wfc "$EVIDENCE/wfc"
          readelf -hW "$EVIDENCE/wfc" | tee "$EVIDENCE/binary.log"
          version=$("$EVIDENCE/wfc" --version)
          [[ "$version" == *"(Rust, x86_64-unknown-linux-gnu, release, build $WFC_BUILD_ID)" ]]
          printf '%s\n' "$version" | tee -a "$EVIDENCE/binary.log"
          (cd "$EVIDENCE" && sha256sum wfc | tee binary.sha256)
      - name: Verify complete Codex continuation and reminder entries
        working-directory: product
        run: |
          selectors=(
            workflow::backend::bundled::input::tests::bundled_continue_requires_the_complete_wrapped_brief
            workflow::backend::bundled::input::tests::bundled_reminder_requires_a_complete_new_user_entry
          )
          for selector in "${selectors[@]}"; do
            cargo +1.96.1 test --release --locked --bin wfc "$selector" -- --exact \
              2>&1 | tee -a "$EVIDENCE/input-unit.log"
            grep -Fx "test $selector ... ok" "$EVIDENCE/input-unit.log"
          done
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed;' "$EVIDENCE/input-unit.log")" -eq "${#selectors[@]}"
      - name: Verify a second task in the original PTY and adjacent nudge and reply
        working-directory: product
        run: |
          (cd "$EVIDENCE" && sha256sum --check --strict binary.sha256)
          test "$(id -u)" -gt 0
          command -v /usr/bin/jq
          unit="wfc-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture=$(mktemp -d "$RUNNER_TEMP/wfc-input.XXXXXXXX")
          trap 'rm -r -- "$fixture"' EXIT
          cat > "$fixture/run.sh" <<'RUN'
          uid=$1
          unit=$2
          tmp=$3
          fixture_script=$4
          binary=$5
          mode=$6
          [[ "$(id -u)" == "$uid" && "$uid" -gt 0 ]]
          IFS= read -r membership < "/proc/$$/cgroup"
          [[ "$membership" == "0::/system.slice/$unit.service" ]]
          delegation="/sys/fs/cgroup${membership#0::}"
          test "$(stat -f -c '%T' "$delegation")" = cgroup2fs
          exec /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 TMPDIR="$tmp" \
            WFC_TEST_DELEGATION="$delegation" /bin/sh "$fixture_script" "$binary" "$mode"
          RUN
          for mode in continue nudge reply; do
            (cd "$EVIDENCE" && sha256sum --check --strict binary.sha256)
            sudo systemd-run --unit="$unit-$mode" --wait --pipe --collect \
              --property=Type=exec --property="User=$(id -un)" --property=Delegate=yes \
              --property=RuntimeMaxSec=120s --property=TimeoutStopSec=10s \
              /usr/bin/bash -euo pipefail "$fixture/run.sh" "$(id -u)" "$unit-$mode" \
              "$fixture" "$PWD/tools/check_bundled_default.sh" "$EVIDENCE/wfc" "$mode" \
              2>&1 | tee "$EVIDENCE/$mode.log"
            if grep -Fq BUNDLED_DELEGATION_UNVERIFIED "$EVIDENCE/$mode.log"; then exit 1; fi
            (cd "$EVIDENCE" && sha256sum --check --strict binary.sha256)
          done
          test "$(grep -Fxc BUNDLED_CONTINUE_RECEIPT_PASS "$EVIDENCE/continue.log")" -eq 1
          test "$(grep -Fxc BUNDLED_NUDGE_RECEIPT_PASS "$EVIDENCE/nudge.log")" -eq 1
          test "$(grep -Fxc BUNDLED_REPLY_RECEIPT_PASS "$EVIDENCE/reply.log")" -eq 1
          test "$(grep -Ec '^BUNDLED_REPLY_PASTE_ENTER_NS=[0-9]+$' "$EVIDENCE/reply.log")" -eq 1
      - name: Checksum the fixed evidence
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          if [ -f binary.sha256 ]; then sha256sum --check --strict binary.sha256; fi
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: bundled-codex-continue-${{ env.WFC_BUILD_ID }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
