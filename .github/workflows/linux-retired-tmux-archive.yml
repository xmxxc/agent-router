name: Jammy retired tmux archive boundary
on:
  push:
    branches: [rust-router/31-retired-tmux-r41-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  retired-tmux-archive:
    name: '#31 synthetic archive boundary'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PRODUCT_SHA: 2ef519c0929cf6db5f9fcba51af154a39a64f788
      PRODUCT_TREE: 3e5a74bb4bd0292f2a261d2aaf14e80148650a02
      PRODUCT_PARENTS: d579c9ad04abb3b8940cf3a6fcab133e47dbadec
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      NATIVE_INPUT_TREE: 7480986f4468ffafc76b95012562945ee586b52a
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/linux-retired-tmux-r41-evidence
    steps:
      - name: Record workflow and run identity
        run: |
          mkdir -p "$EVIDENCE"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW_SHA" "head=$GITHUB_SHA" \
            "ref=$GITHUB_REF" "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" \
            "expectedProduct=$PRODUCT_SHA" "expectedTree=$PRODUCT_TREE" \
            "expectedParents=$PRODUCT_PARENTS" | tee "$EVIDENCE/run.log"
      - name: Check out the fixed workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          persist-credentials: false
      - name: Check out the fixed R41 product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Check out the approved zlib archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the fixed sources and product input manifest
        working-directory: product
        run: |
          {
            test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
            test "$GITHUB_REF" = refs/heads/rust-router/31-retired-tmux-r41-jammy-ci
            test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
            ci_parents=$(git -C ../ci cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd' ' -)
            test "$ci_parents" = "$PRODUCT_SHA"
            git -C ../ci show -s --format='ci=%H tree=%T parents=%P'
            test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
            parents=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd' ' -)
            test "$parents" = "$PRODUCT_PARENTS"
            git show -s --format='product=%H tree=%T parents=%P'
            test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
            test "$(git -C ../native-input rev-parse 'HEAD^{tree}')" = "$NATIVE_INPUT_TREE"
            git -C ../native-input show -s --format='nativeInput=%H tree=%T'
            for checkout in . ../ci ../native-input; do
              test -z "$(git -C "$checkout" status --porcelain)"
            done
            sha256sum vendor/INPUTS.sha256 tests/legacy_tmux_archive.py tests/legacy_public.py \
              ../ci/.github/workflows/linux-retired-tmux-archive.yml
            sha256sum --check --strict vendor/INPUTS.sha256
            test "$(wc -l < vendor/INPUTS.sha256)" = 128
            printf '%s  %s\n' c5e3198844de5b964ee31b1a46fde195ff967d96784ebbc579be9bcd55863582 tests/legacy_public.py |
              sha256sum --check --strict
          } 2>&1 | tee "$EVIDENCE/sources.log"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the approved Zig archive
        run: |
          {
            package=zig-x86_64-linux-0.16.0
            archive="$RUNNER_TEMP/$package.tar.xz"
            digest=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            verified=0
            for base in https://ziglang.org/download/0.16.0 https://zig.bcr.ist; do
              url="$base/$package.tar.xz"
              printf 'Downloading %s\n' "$url"
              if curl --fail --silent --show-error --location --retry 2 --retry-max-time 180 \
                --connect-timeout 15 --max-time 120 --output "$archive" "$url" &&
                printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict; then
                verified=1
                break
              fi
            done
            test "$verified" = 1
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            zig_dir="$RUNNER_TEMP/$package"
            version=$("$zig_dir/zig" version)
            printf 'Zig %s\n' "$version"
            test "$version" = 0.16.0
            printf '%s\n' "$zig_dir" >> "$GITHUB_PATH"
          } 2>&1 | tee "$EVIDENCE/zig-install.log"
      - name: Prepare the fixed build toolchain
        run: |
          {
            rustup toolchain install 1.96.1 --profile minimal
            test "$(id -u)" -ne 0
            grep -Fx 'VERSION_ID="22.04"' /etc/os-release
            getconf GNU_LIBC_VERSION
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
            id -u
            uname -srm
            rustc +1.96.1 -vV
            cargo +1.96.1 --version
            zig version
            python3 --version
            cc --version
          } 2>&1 | tee "$EVIDENCE/toolchain.log"
      - name: Materialize verified Ghostty and zlib sources
        working-directory: product
        run: |
          python3 tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz \
            2>&1 | tee "$EVIDENCE/native-prepare.log"
      - name: Prime the pinned Wuffs package
        working-directory: product/vendor/libghostty-vt
        run: |
          {
            url=https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz
            archive="$RUNNER_TEMP/wuffs.tar.gz"
            printf 'Wuffs source %s\n' "$url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --retry-max-time 120 --connect-timeout 15 --max-time 60 "$url" -o "$archive"
            printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" |
              sha256sum --check --strict
            package=$(zig fetch "$archive")
            printf 'Wuffs Zig package %s\n' "$package"
            test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
          } 2>&1 | tee "$EVIDENCE/wuffs.log"
      - name: Build and identify the fixed release ELF
        id: build
        working-directory: product
        env:
          WFC_BUILD_ID: ${{ env.PRODUCT_SHA }}
        run: |
          {
            cargo +1.96.1 build --release --locked --target "$TARGET" --bin wfc
            binary="target/$TARGET/release/wfc"
            version=$("$binary" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(Rust, $TARGET, release, build $PRODUCT_SHA)" ]]
            sha256sum "$binary" | tee "$EVIDENCE/elf.sha256"
            readelf -hW "$binary"
          } 2>&1 | tee "$EVIDENCE/build.log"
      - name: Verify synthetic JSON and SQLite archives
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        run: |
          {
            binary="target/$TARGET/release/wfc"
            sha256sum --check --strict "$EVIDENCE/elf.sha256"
            fixture_root=$(mktemp -d "$RUNNER_TEMP/r41-archive-fixture.XXXXXXXX")
            trap 'rmdir "$fixture_root"' EXIT
            printf '%s\n' "fixture=tests/legacy_tmux_archive.py" "scope=synthetic JSON and SQLite"
            result=0
            TMPDIR="$fixture_root" python3 -Bu tests/legacy_tmux_archive.py "$binary" || result=$?
            sha256sum --check --strict "$EVIDENCE/elf.sha256"
            rmdir "$fixture_root"
            trap - EXIT
            printf 'fixture_exit=%s fixture_root_removed=yes\n' "$result"
            exit "$result"
          } 2>&1 | tee "$EVIDENCE/archive-fixture.log"
          grep -Fx 'native: explicit and inferred history, preserved receipts and no execution target' "$EVIDENCE/archive-fixture.log"
          grep -Fx 'mixed: retired attempts and damaged reservations preserved, active receipts delivered' "$EVIDENCE/archive-fixture.log"
          grep -Fx 'publication: inconsistent generations left untouched, matching callbacks delivered' "$EVIDENCE/archive-fixture.log"
          grep -Fx 'SQLite-only: history visible, live state unknown, original bytes preserved' "$EVIDENCE/archive-fixture.log"
      - name: Verify the archive boundaries with exact Rust selectors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: product
        env:
          WFC_BUILD_ID: ${{ env.PRODUCT_SHA }}
        run: |
          selectors=(
            workflow::assignment::tests::retired_tmux_classification_keeps_explicit_backends
            workflow::assignment::tests::handoff_receipts_are_classified_by_original_round_and_attempt
            workflow::assignment::tests::handoff_archive_requires_a_published_target_and_proven_stop
            workflow::messages::recovery::tests::callback_assignment_uses_consistent_publication_generations
            workflow::worker_owner::tests::reservation_requires_an_ordinary_command_generation
            workflow::messages::recovery::tests::startup_recovery_skips_retired_attempts_in_small_slices
            workflow::messages::startup_recovery_tests::startup_recovery_preserves_retired_question
            workflow::backend::tests::archived_startup_terminal_evidence_does_not_publish
            workflow::messages::relay::tests::relay_claim_leaves_retired_attempt_receipts_untouched
          )
          log="$EVIDENCE/rust-archive.log"
          {
            sha256sum --check --strict "$EVIDENCE/elf.sha256"
            result=0
            for selector in "${selectors[@]}"; do
              printf 'selector=%s\n' "$selector"
              cargo +1.96.1 test --release --locked --target "$TARGET" --bin wfc -- "$selector" --exact || result=$?
            done
            sha256sum --check --strict "$EVIDENCE/elf.sha256"
            exit "$result"
          } 2>&1 | tee "$log"
          for selector in "${selectors[@]}"; do
            grep -Fx "test $selector ... ok" "$log"
          done
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log")" = "${#selectors[@]}"
      - name: Checksum the available evidence
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          shopt -s nullglob
          files=( *.log *.sha256 )
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload Jammy archive evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-retired-tmux-r41-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
