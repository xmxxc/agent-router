name: Jammy bundled offline resume review fixes

on:
  push:
    branches: [rust-router/32-bundled-offline-resume-review-fixes-r35-jammy-ci]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bundled-offline-resume-review-fixes:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      WFC_BUILD_ID: 3425e07985cc15d4040d21c963eba1c007ef2396
      PRODUCT_TREE: 4fde223855da1bedd8d64fc3d5b9d75f7d1ca261
      PRODUCT_PARENT: 44e56afa0e962ede9e58ed02c602cd559ca5e872
      INPUTS_SHA256: 8b47586715c0dece7b5f92d83e1f300befa675b8820831e4775c1d450c1783c0
      NATIVE_INPUT_SHA: dbae2c45e4ce46d528ec276de743f6d20dd1b51f
      EVIDENCE: ${{ github.workspace }}/bundled-offline-resume-review-fixes-evidence
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - name: Record the hosted run
        run: |
          mkdir -p "$EVIDENCE"
          printf 'workflow %s\nrun %s attempt %s\nproduct %s\n' \
            "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WFC_BUILD_ID" \
            | tee "$EVIDENCE/run.log"
          { cat /etc/os-release; uname -a; getconf GNU_LIBC_VERSION; id -u; } | tee -a "$EVIDENCE/run.log"
          test "$(id -u)" -gt 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WFC_BUILD_ID }}
          path: product
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NATIVE_INPUT_SHA }}
          path: native-input
          sparse-checkout: vendor/zlib-1.3.1.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Verify product and CI provenance
        working-directory: product
        run: |
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$WFC_BUILD_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git show -s --format=%P HEAD)" = "$PRODUCT_PARENT"
          test "$(git -C ../ci rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C ../ci show -s --format=%P HEAD)" = "$WFC_BUILD_ID"
          test "$(git -C ../native-input rev-parse HEAD)" = "$NATIVE_INPUT_SHA"
          git log -1 --format='product %H tree %T parent %P' | tee "$EVIDENCE/product.log"
          git -C ../ci log -1 --format='ci %H tree %T parent %P' | tee -a "$EVIDENCE/product.log"
          printf '%s  %s\n' "$INPUTS_SHA256" vendor/INPUTS.sha256 | sha256sum --check --strict | tee "$EVIDENCE/inputs.log"
          test "$(wc -l < vendor/INPUTS.sha256)" -eq 140
          sha256sum --check --strict vendor/INPUTS.sha256 | tee -a "$EVIDENCE/inputs.log"
          printf '%s  %s\n' 17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c \
            ../native-input/vendor/zlib-1.3.1.tar.gz | sha256sum --check --strict | tee -a "$EVIDENCE/inputs.log"
          sha256sum ../ci/.github/workflows/linux-bundled-offline-resume-review-fixes.yml | tee -a "$EVIDENCE/inputs.log"
      - name: Prepare the pinned native dependencies
        working-directory: product
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          { rustc +1.96.1 -vV; cargo +1.96.1 --version; zig version; } | tee "$EVIDENCE/toolchain.log"
          test "$(zig version)" = 0.16.0
          python tools/prepare.py --zlib-archive ../native-input/vendor/zlib-1.3.1.tar.gz \
            2>&1 | tee "$EVIDENCE/prepare.log"
      - name: Prime the pinned Wuffs package with bounded download retries
        working-directory: product/vendor/libghostty-vt
        run: |
          archive="$RUNNER_TEMP/wuffs.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 15 --max-time 60 \
            https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz -o "$archive"
          printf '%s  %s\n' 17877d346f7988651d6c62e45b2e3b05c86809a6442c5e34612374b2a9719a1c "$archive" \
            | sha256sum --check --strict | tee "$EVIDENCE/wuffs.log"
          package=$(zig fetch "$archive")
          test "$package" = 'N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI'
      - name: Check bundled offline resume authorization and signed stop evidence
        working-directory: product
        run: |
          fixture=$(mktemp -d "$RUNNER_TEMP/wfc-offline-resume.XXXXXXXX")
          trap 'rm -r -- "$fixture"' EXIT
          unset WFC_CONTROLLER_TOKEN WFC_OWNER_TOKEN WFC_WORKER_CALLBACK WFC_BUNDLED_CGROUP_ROOT
          export WFC_STATE="$fixture" TMPDIR="$fixture"
          selectors=(
            workflow::backend::bundled::tests::delegated_resume_rechecks_expired_owner_after_unit_lock
            bundled::tests::delegated_launch_denial_preserves_ticket_and_respects_write_fence
            workflow::resume::tests::bundled_first_task_resume_requires_original_stop_and_starts_once
            workflow::input::tests::bundled_continue_finishes_matching_first_publication
            bundled::store::tests::managed_startup_keeps_the_first_signed_decision
            workflow::input::tests::bundled_zero_write_recovery_never_sends_input
            workflow::input::tests::bundled_zero_write_recovery_preserves_existing_close_binding
            workflow::input::recovery::tests::proof_recovers_only_the_staged_input
            workflow::input::recovery::tests::a_receipt_or_new_round_callback_conflicts_with_zero_send
          )
          printf '%s\n' "${selectors[@]}" | tee "$EVIDENCE/selectors.log"
          for selector in "${selectors[@]}"; do
            # Keep raw test output in the temporary fixture. Publish only fixed
            # success lines so a failing assertion cannot expose a recovery proof.
            if ! cargo +1.96.1 test --release --locked --bin wfc "$selector" -- --exact \
              > "$fixture/test.log" 2>&1; then
              printf 'Fixed test failed: %s\n' "$selector" >&2
              exit 1
            fi
            grep -Fx "test $selector ... ok" "$fixture/test.log" | tee -a "$EVIDENCE/offline-resume.log"
            grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+\.[0-9]+s$' \
              "$fixture/test.log" | tee -a "$EVIDENCE/offline-resume.log"
          done
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed;' "$EVIDENCE/offline-resume.log")" -eq "${#selectors[@]}"
      - name: Checksum the fixed evidence
        if: ${{ always() }}
        run: |
          cd "$EVIDENCE"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: bundled-offline-resume-review-fixes-${{ env.WFC_BUILD_ID }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
