name: Linux clean guest preflight
on:
  push:
    branches: [rust-router/linux-package-guest-preflight]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guest-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EVIDENCE: ${{ github.workspace }}/guest-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare the pinned offline guest
        run: bash tools/ci/linux-guest-preflight/prepare.sh "$RUNNER_TEMP/wfc-clean-guest" "$EVIDENCE"
      - name: Check only the one-shot guest platform
        run: bash tools/ci/linux-guest-preflight/boot.sh "$RUNNER_TEMP/wfc-clean-guest" "$EVIDENCE"
      - name: Retain preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-guest-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: ignore
          retention-days: 7
