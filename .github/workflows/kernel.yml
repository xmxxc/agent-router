name: Native candidates
on:
  pull_request:
  push:
    branches: [main]
    tags: ['candidate-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            triple: x86_64-pc-windows-msvc
            exe: wfc.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            exe: wfc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WFC_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
      TRIPLE: ${{ matrix.triple }}
      EXE: ${{ matrix.exe }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: python tools/prepare.py
      - run: cargo build --release --locked --target "$TRIPLE"
      - run: cargo test --workspace --release --locked --target "$TRIPLE"
      - name: Smoke-test staged distribution
        run: |
          dir='target/standalone kernel'
          mkdir -p "$dir"
          cp "target/$TRIPLE/release/$EXE" "$dir/$EXE"
          "$dir/$EXE" --version
          python tools/smoke.py "$dir/$EXE" --kernel
          python tools/collect_notices.py "$TRIPLE" "$dir/bundled-notices"
          git rev-parse HEAD > "$dir/COMMIT.txt"
      - name: Fetch pinned WFC lifecycle suite
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xmxxc/workflow-core
          ref: 3c06c0905faaf9e61de49404c33e70720409607f
          path: integration-workflow-core
          persist-credentials: false
      - name: Verify Windows lifecycle and Job Object cleanup
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: |
          cp "target/standalone kernel/$EXE" target/wfc-kernel.exe
          python tools/check_wfc.py integration-workflow-core target/wfc-kernel.exe
      - name: Archive verified binaries with notices
        run: |
          mkdir -p dist
          base="wfc-$PLATFORM-$WFC_BUILD_ID"
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -c "dist/$base.zip" "target/standalone kernel/"*
          else
            tar -czf "dist/$base.tar.gz" -C 'target/standalone kernel' .
          fi
          cd dist
          sha256sum "$base".* > "$PLATFORM.sha256"
          sha256sum -c "$PLATFORM.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wfc-${{ matrix.platform }}-${{ env.WFC_BUILD_ID }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/candidate-')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish both checked archives as a test release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'wfc-*-x64-*' --dir artifacts
          mkdir dist
          for platform in linux-x64 windows-x64; do
            dir="artifacts/wfc-$platform-$GITHUB_SHA"
            (cd "$dir" && sha256sum -c "$platform.sha256")
            cp "$dir"/* dist/
          done
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "$TAG" --notes "Linux x64 and Windows x64 test binaries for commit $GITHUB_SHA."
