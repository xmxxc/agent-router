[package]
name = "wfc-legacy-state"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE-WFC"
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["user"] }
